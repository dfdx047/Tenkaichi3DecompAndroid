<!doctype html>
<html><head><meta charset="utf-8"><title>Dragon Rage Intro</title>
<style>html,body{margin:0;background:#0e111c;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const out = document.getElementById('c');
const octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const sceneCv = mk(), accCv = mk(), textCv = mk();
const sctx = sceneCv.getContext('2d'), actx = accCv.getContext('2d'), tctx = textCv.getContext('2d');
let ctx = sctx;

const BG = '#0e111c';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutBack = (k, c1 = 2.2) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeInQuad = k => k * k;
const easeInCubic = k => k * k * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeOutQuart = k => 1 - Math.pow(1 - k, 4);
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const linear = k => k;
const rand = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const spring = (dt, freq = 22, damp = 7) => dt < 0 ? 0 : Math.exp(-damp * dt) * Math.cos(freq * dt);
const bell = k => Math.sin(clamp(k) * Math.PI);

// ---------- final layout (matches the logo) ----------
const TITLE = 'DRAGON RAGE';
const FONT_TITLE = 'italic 800 132px Inter, Roboto, sans-serif';
const FONT_SUB = '400 64px Inter, Roboto, sans-serif';
const FINAL_R = 96;
let L = null;
function layout() {
  sctx.font = FONT_TITLE;
  const titleW = sctx.measureText(TITLE).width, gap = 120;
  const left = (W - (FINAL_R * 2 + gap + titleW)) / 2, textX = left + FINAL_R * 2 + gap;
  const letters = [...TITLE].map((ch, i) => ({ ch, x: textX + sctx.measureText(TITLE.slice(0, i)).width, w: sctx.measureText(ch).width }));
  L = { ball: { x: left + FINAL_R, y: H / 2 + 6 }, textX, titleW, titleY: H / 2 - 8, subY: H / 2 + 92, letters };
}

// ---------- timeline ----------
const C = { x: W / 2, y: H / 2 };
const R0 = 140;
const T = {
  charge: [0, .45], appear: [.45, .72], shine: [.88, 1.18],
  antic: [1.35, 1.5], launch: [1.5, 1.85],          // flies into the lens -> cut
  side1: [1.85, 3.4], boom1: 2.95,                   // tracking shot, picking up speed
  front: [3.4, 3.95],                                // head-on, passes glued to the lens -> cut
  side2: [3.95, 5.0], boom2: 4.2, surge: [4.55, 4.85],// max speed, bursts out of frame
  impact: [5.0, 7.9], arrive: [5.12, 5.33], hit: 5.33,
};
const HOLD = T.hit + .085;
const DURATION = 7.9;
const CUTS = [T.launch[1], T.front[0], T.front[1], T.side2[1], T.hit, T.hit + .04, HOLD];

const spinAt = t => { const k = prog(t, T.antic[0], T.hit); return (1 - Math.pow(1 - Math.pow(k, 2.2), 3)) * Math.PI * 2 * 16; };

// ---------- ball ----------
function starPath(cx, cy, r, sx, sy) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    const px = cx + Math.cos(a) * rr * sx, py = cy + Math.sin(a) * rr * sy;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
const STARS = [[-0.30, -0.36], [0.30, -0.36], [-0.30, 0.20], [0.30, 0.20]];

function glow(x, y, r, s, rad = 2.2) {
  if (s <= 0) return;
  const g = ctx.createRadialGradient(x, y, r * .7, x, y, r * rad);
  g.addColorStop(0, `rgba(255,200,70,${.6 * s})`); g.addColorStop(.45, `rgba(255,160,40,${.2 * s})`); g.addColorStop(1, 'rgba(255,140,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * rad, 0, Math.PI * 2); ctx.fill();
}

function ballBody(r, spin, shineK, opts = {}) {
  if (opts.silhouette) { ctx.fillStyle = opts.silhouette; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); return; }
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r * 1.05);
  g.addColorStop(0, '#ffd870'); g.addColorStop(.45, '#ffa51f'); g.addColorStop(.85, '#ea770a'); g.addColorStop(1, '#c25805');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  for (const [lon0, lat] of STARS) {
    const lon = lon0 + spin, z = Math.cos(lon) * Math.cos(lat);
    if (z <= .02) continue;
    ctx.globalAlpha = clamp(z * 3);
    ctx.fillStyle = '#d8261c';
    starPath(Math.sin(lon) * Math.cos(lat) * r, Math.sin(lat) * r, r * .25, Math.max(.05, Math.cos(lon)), Math.cos(lat));
    ctx.fill(); ctx.strokeStyle = 'rgba(150,20,10,.55)'; ctx.lineWidth = r * .012; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const rim = ctx.createRadialGradient(0, 0, r * .7, 0, 0, r);
  rim.addColorStop(0, 'rgba(160,60,0,0)'); rim.addColorStop(1, 'rgba(140,45,0,.4)');
  ctx.fillStyle = rim; ctx.fillRect(-r, -r, r * 2, r * 2);
  if (shineK > 0 && shineK < 1) {
    const p = lerp(-1.7, 1.7, easeInOut(shineK));
    ctx.rotate(-Math.PI / 4);
    const sg = ctx.createLinearGradient(p * r - r * .4, 0, p * r + r * .4, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,240,.9)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4);
  }
  ctx.restore();
  ctx.save(); ctx.translate(-r * .32, -r * .5); ctx.rotate(-.35); ctx.scale(1, .55);
  const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .3);
  hg.addColorStop(0, 'rgba(255,255,255,.95)'); hg.addColorStop(.6, 'rgba(255,255,255,.5)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, r * .3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ball with stretch along an angle + optional squash wobble
function drawBall(x, y, r, t, o = {}) {
  if (r <= .5) return;
  const st = o.stretch || 1, ang = o.ang || 0, sq = o.squash || 0;
  ctx.save(); ctx.translate(x, y);
  ctx.rotate(ang); ctx.scale(st * (1 + sq), (1 - sq) / Math.sqrt(st)); ctx.rotate(-ang);
  ballBody(r, spinAt(t), o.shine || 0, o);
  ctx.restore();
}

// velocity-aware ball from a position function
function drawBallFn(pos, t, b, o = {}) {
  const p = pos(t - 1 / 240);
  let ang = 0, st = 1;
  if (p && Math.abs(p.x - b.x) < 600) {
    const vx = (b.x - p.x) * 240, vy = (b.y - p.y) * 240;
    ang = Math.atan2(vy, vx); st = 1 + clamp(Math.hypot(vx, vy) / 12000, 0, .4);
  }
  drawBall(b.x, b.y, b.r, t, { ...o, ang, stretch: st });
}

function afterimagesFn(pos, t, n, step, alpha) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const now = pos(t);
  for (let i = n; i >= 1; i--) {
    const tt = t - i * step, b = pos(tt);
    if (!b || !now || Math.abs(b.x - now.x) > 900 || b.r < 2) continue;
    ctx.globalAlpha = alpha * (1 - i / (n + 1));
    drawBallFn(pos, tt, b);
  }
  ctx.restore();
}

// ---------- energy ribbons ----------
function ribbonPts(s, alpha, hot = 1) {
  if (alpha <= 0 || s.length < 2) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [wm, rgb, a] of [[1, '255,130,20', .55], [.55, '255,205,90', .7], [.2, '255,255,230', .9 * hot]]) {
    const Lp = [], Rp = [];
    for (let i = 0; i < s.length; i++) {
      const p = s[Math.max(0, i - 1)], q = s[Math.min(s.length - 1, i + 1)];
      let nx = -(q.y - p.y), ny = q.x - p.x; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
      Lp.push([s[i].x + nx * s[i].w * wm, s[i].y + ny * s[i].w * wm]);
      Rp.push([s[i].x - nx * s[i].w * wm, s[i].y - ny * s[i].w * wm]);
    }
    const h = s[0], tl = s[s.length - 1];
    const g = ctx.createLinearGradient(h.x, h.y, tl.x, tl.y);
    g.addColorStop(0, `rgba(${rgb},${a * alpha})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath();
    Lp.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    for (let i = Rp.length - 1; i >= 0; i--) ctx.lineTo(...Rp[i]);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function ribbonFn(pos, t, win, widthMul, alpha, hot = 1) {
  const N = 48, pts = [];
  for (let i = 0; i <= N; i++) {
    const b = pos(t - i / N * win);
    if (!b || b.r < 2) break;
    if (pts.length && Math.hypot(b.x - pts[pts.length - 1].x, b.y - pts[pts.length - 1].y) > 700) break;
    pts.push({ x: b.x, y: b.y, w: b.r * widthMul * Math.pow(1 - i / N, .7) * (1 + .18 * Math.sin(i * 1.7 + t * 60)) });
  }
  ribbonPts(pts, alpha, hot);
}
// horizontal trail streaming behind a ball in the tracking shot
function streamTrail(x, y, r, len, alpha, t) {
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const s = i / 40;
    pts.push({ x: x - s * len, y: y + Math.sin(s * 7 - t * 34) * r * .12 * s, w: r * .95 * Math.pow(1 - s, .6) * (1 + .2 * Math.sin(s * 23 - t * 70)) });
  }
  ribbonPts(pts, alpha);
}

// ---------- shounen ki aura ----------
function aura(x, y, r, dir, bend, size, t, alpha = 1) {
  if (alpha <= 0 || size <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [ls, rgb, a] of [[1, '255,110,20', .75], [.72, '255,190,70', .8], [.45, '255,250,215', .85]]) {
    const n = 22;
    for (let i = 0; i < n; i++) {
      const ang = i / n * Math.PI * 2 + Math.sin(t * 3 + i) * .08;
      const back = (1 + Math.cos(ang - dir)) / 2;           // 1 = faces away from motion
      let nx = Math.cos(ang) * (1 - bend) + Math.cos(dir) * bend * 1.3;
      let ny = Math.sin(ang) * (1 - bend) + Math.sin(dir) * bend * 1.3;
      const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
      const flick = .55 + .45 * Math.sin(t * 38 + i * 2.31 + rand(i) * 6);
      const len = r * size * ls * flick * lerp(1, .18 + .82 * back, bend);
      const bx = x + Math.cos(ang) * r * .92, by = y + Math.sin(ang) * r * .92;
      const w = r * .32 * ls;
      const px = -Math.sin(ang), py = Math.cos(ang);
      const tx = bx + nx * len, ty = by + ny * len;
      const wig = Math.sin(t * 25 + i) * len * .25;
      const g = ctx.createRadialGradient(x, y, r * .8, x, y, r + len);
      g.addColorStop(0, `rgba(${rgb},${a * alpha})`); g.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(bx + px * w, by + py * w);
      ctx.quadraticCurveTo(bx + nx * len * .5 + px * (w + wig), by + ny * len * .5 + py * (w + wig), tx, ty);
      ctx.quadraticCurveTo(bx + nx * len * .5 - px * (w - wig), by + ny * len * .5 - py * (w - wig), bx - px * w, by - py * w);
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

// ---------- fx ----------
function focusLines(cx, cy, k, seed, color = '255,240,210', inner = 260) {
  if (k <= 0) return;
  ctx.save(); ctx.fillStyle = `rgba(${color},${.5 * clamp(k, 0, 2)})`;
  for (let i = 0; i < 90; i++) {
    const a = rand(seed + i) * Math.PI * 2, w = .004 + rand(seed + i + 200) * .012;
    const r0 = inner + rand(seed + i + 400) * 380, r1 = 2400;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a - w) * r1, cy + Math.sin(a - w) * r1);
    ctx.lineTo(cx + Math.cos(a + w) * r1, cy + Math.sin(a + w) * r1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function speedLines(t, k, dir, seed, n = 40) {
  if (k <= 0) return;
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const y = rand(seed + i) * H, len = 250 + rand(seed + i + 50) * 700, sp = 5000 + rand(seed + i + 9) * 5000;
    let x = ((rand(seed + i + 3) * W * 3 + t * sp) % (W + len * 2)) - len;
    if (dir < 0) x = W - x;
    ctx.strokeStyle = `rgba(255,235,190,${.22 * k * (.3 + rand(seed + i + 7) * .7)})`;
    ctx.lineWidth = 1 + rand(seed + i + 11) * 4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * dir, y); ctx.stroke();
  }
  ctx.restore();
}
function ring(x, y, r, lw, a, col = '255,225,140') {
  if (a <= 0) return;
  ctx.strokeStyle = `rgba(${col},${a})`; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
}
function twinkle(x, y, s, a) {
  if (a <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,255,240,${a})`;
  for (const rot of [0, Math.PI / 2]) {
    ctx.save(); ctx.rotate(rot + Math.PI / 8);
    ctx.beginPath(); ctx.moveTo(-s, 0); ctx.quadraticCurveTo(0, 0, 0, -s * .12); ctx.quadraticCurveTo(0, 0, s, 0);
    ctx.quadraticCurveTo(0, 0, 0, s * .12); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function screenFill(rgb, a) { if (a <= 0) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(${rgb},${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function vignette(a = .55) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---------- camera ----------
function interpKeys(K, t) {
  if (t <= K[0][0]) return K[0].slice(1, 5);
  if (t >= K[K.length - 1][0]) return K[K.length - 1].slice(1, 5);
  let i = 1; while (K[i][0] < t) i++;
  const a = K[i - 1], b = K[i], e = b[5]((t - a[0]) / (b[0] - a[0]));
  return [1, 2, 3, 4].map(j => lerp(a[j], b[j], e));
}
function applyCam(x, y, zoom, rot, sx = 0, sy = 0) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-x, -y);
}
const shakeXY = (t, s) => [Math.sin(t * 97) * s, Math.cos(t * 83) * s * .7];

function drawBackdrop(t, cx, cy, zoom, rot) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2);
  const amb = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W * .75);
  amb.addColorStop(0, 'rgba(45,50,90,.3)'); amb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = amb; ctx.fillRect(-400, -400, W + 800, H + 800);
  for (const [depth, n, size, alpha, seed] of [[.35, 30, 14, .035, 0], [.7, 50, 3, .1, 100], [1.2, 30, 4, .14, 200]]) {
    const span = W + 800, spanY = H + 800;
    for (let i = 0; i < n; i++) {
      let x = (rand(seed + i) * span * 2 - (cx - C.x) * depth * zoom + t * 20 * depth) % span; if (x < 0) x += span;
      let y = (rand(seed + i + 50) * spanY * 2 - (cy - C.y) * depth * zoom) % spanY; if (y < 0) y += spanY;
      x -= 400; y -= 400;
      x = W / 2 + (x - W / 2) * (1 + (zoom - 1) * depth); y = H / 2 + (y - H / 2) * (1 + (zoom - 1) * depth);
      ctx.fillStyle = depth < .5 ? `rgba(120,130,220,${alpha})` : `rgba(200,210,255,${alpha + rand(seed + i + 9) * alpha})`;
      ctx.beginPath(); ctx.arc(x, y, size * (.5 + rand(seed + i + 7)) * (depth < .5 ? 1 : zoom), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

// =====================================================================
// SHOT 1 — awakening + launch into the lens
// =====================================================================
const CAM1 = [
  [0.00, C.x, C.y, .9, -.04, null],
  [0.45, C.x, C.y, 1.14, .025, easeInQuad],
  [0.54, C.x, C.y, 1.38, -.01, easeOutExpo],
  [0.75, C.x, C.y, 1.2, -.03, easeOutCubic],
  [1.18, C.x + 25, C.y - 12, 1.5, .035, easeInOut],
  [1.35, C.x + 10, C.y - 5, 1.42, .02, easeOutCubic],
  [1.50, C.x - 90, C.y + 10, .98, -.1, easeOutExpo],
  [1.85, C.x + 120, C.y + 40, 1.12, .07, easeInCubic],
];
function pos1(t) {
  if (t < T.appear[0]) return null;
  if (t < T.antic[0]) {
    const s = Math.max(0, easeOutBack(prog(t, ...T.appear)));
    const bob = Math.sin((t - T.appear[1]) * 6) * 6 * prog(t, T.appear[1], T.appear[1] + .2);
    return { x: C.x, y: C.y + bob, r: R0 * s };
  }
  if (t < T.launch[0]) { const k = easeOutCubic(prog(t, ...T.antic)); return { x: C.x - 55 * k, y: C.y + 10 * k, r: R0 * lerp(1, .88, k) }; }
  const e = easeInCubic(prog(t, ...T.launch));
  return { x: lerp(C.x - 55, C.x + 240, e), y: lerp(C.y + 10, C.y + 90, e), r: R0 * lerp(.88, 17, e) };
}
function drawCharge(t) {
  const k = prog(t, ...T.charge);
  if (k <= 0 || t > T.appear[0] + .05) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let i = 0; i < 60; i++) {
    const a = rand(i + 700) * Math.PI * 2, d0 = 320 + rand(i + 800) * 700;
    const start = rand(i + 900) * .45, kk = clamp((k - start) / (1 - start));
    if (kk <= 0) continue;
    const d = d0 * (1 - easeInQuad(kk)), d2 = d + 40 + 160 * kk;
    ctx.strokeStyle = `rgba(255,${190 + (i % 60)},100,${.85 * bell(kk)})`;
    ctx.lineWidth = 2 + rand(i) * 3;
    ctx.beginPath(); ctx.moveTo(C.x + Math.cos(a) * d, C.y + Math.sin(a) * d); ctx.lineTo(C.x + Math.cos(a) * d2, C.y + Math.sin(a) * d2); ctx.stroke();
  }
  const core = easeInCubic(k) * 40;
  const g = ctx.createRadialGradient(C.x, C.y, 0, C.x, C.y, core * 3 + 1);
  g.addColorStop(0, 'rgba(255,255,230,1)'); g.addColorStop(.3, 'rgba(255,200,80,.7)'); g.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(C.x, C.y, core * 3 + 1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawAppearBurst(t) {
  const dt = t - T.appear[0];
  if (dt < 0 || dt > .5) return;
  const k = dt / .5;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const f = 1 - prog(dt, 0, .2);
  if (f > 0) {
    const g = ctx.createRadialGradient(C.x, C.y, 0, C.x, C.y, 420);
    g.addColorStop(0, `rgba(255,255,230,${.9 * f})`); g.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
  }
  ring(C.x, C.y, R0 * lerp(1, 3.4, easeOutCubic(k)), 14 * (1 - k) + 1, (1 - k) * .9);
  ring(C.x, C.y, R0 * lerp(1, 2.2, easeOutCubic(prog(dt, .05, .45))), 5 * (1 - k) + 1, (1 - k) * .7);
  ctx.restore();
}
function shot1(t) {
  let [cx, cy, z, rot] = interpKeys(CAM1, t);
  let sh = 0;

// =====================================================================

  risingEmbers(t);
  drawImpact(t);
  drawTitle(t);
  screenFill('255,250,235', 1 - prog(t, T.side2[1], T.side2[1] + .06));
  vignette(.35 * (1 - prog(t, HOLD, HOLD + 1)));
}

// ---------- scene dispatcher ----------
function scene(t) {
  ctx = sctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < T.launch[1]) shot1(t);
  else if (t < T.front[0]) sideShot(t);
  else if (t < T.front[1]) frontShot(t);
  else if (t < T.side2[1]) sideShot(t);
  else finalShot(t);
}

// ---------- motion-blurred frame ----------
function draw(t, samples = 6, shutter = 1 / 120) {
  if (!L) layout();
  if (samples <= 1) { scene(t); octx.drawImage(sceneCv, 0, 0); return; }
  actx.globalAlpha = 1; actx.clearRect(0, 0, W, H);
  for (let i = 0; i < samples; i++) {
    let tt = t - shutter * (i / (samples - 1));
    if (CUTS.some(c => tt < c && t >= c)) tt = t;     // never smear across a hard cut
    scene(tt);
    actx.globalAlpha = 1 / (i + 1);
    actx.drawImage(sceneCv, 0, 0);
  }
  octx.drawImage(accCv, 0, 0);
}

window.draw = draw;
window.DURATION = DURATION;

if (!new URLSearchParams(location.search).has('render')) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); out.style.width = W * s + 'px'; out.style.height = H * s + 'px'; };
  addEventListener('resize', fit); fit();
  let start = performance.now();
  const loop = now => { let t = (now - start) / 1000; if (t > DURATION + 1) { start = now; t = 0; } draw(Math.min(t, DURATION), 2); requestAnimationFrame(loop); };
  document.fonts.load(FONT_TITLE).then(() => requestAnimationFrame(loop));
}
</script>
</body></html>
