<!doctype html>
<html><head><meta charset="utf-8"><title>Dragon Rage Intro</title>
<style>html,body{margin:0;background:#0e111c;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 2D retro-anime intro: field -> launch -> chase up through the sky into space -> slam into the title.
// Front-facing camera only. Rendered at 24 fps, supersampled.
const W = 1920, H = 1080;
const RENDER = new URLSearchParams(location.search).has('render');
const SS = RENDER ? 2 : 1;
const WD = W * SS, HD = H * SS;
const out = document.getElementById('c');
out.width = WD; out.height = HD;
const octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = WD; c.height = HD; return c; };
const sceneCv = mk(), textCv = mk(), PA = mk(), PB = mk(), RC = mk(), GC = mk();
const sctx = sceneCv.getContext('2d'), tctx = textCv.getContext('2d');
let ctx = sctx;

const BG = '#0e111c', INK = '#140c10', ORANGE = '#ffa21a', YELLOW = '#ffd23f', WHITE = '#fffbea', AMBER = '#ff8a00', RED = '#d9271c';

// character art (user supplied)
const HERO = new Image();
const READY = new Promise(r => { HERO.onload = r; HERO.src = 'gohan2.jpg'; });
const IW = 1152, IH = 1728;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutBack = (k, c1 = 2.2) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeInQuad = k => k * k;
const easeInCubic = k => k * k * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeOutQuart = k => 1 - Math.pow(1 - k, 4);
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const linear = k => k;
const rand = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const spring = (dt, freq = 22, damp = 7) => dt < 0 ? 0 : Math.exp(-damp * dt) * Math.cos(freq * dt);
const bell = k => Math.sin(clamp(k) * Math.PI);
const boilAt = t => Math.floor(t * 12);
const mixHex = (a, b, k) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(k)))).join(',')})`; };

// ---------- final layout (matches the logo) ----------
const TITLE = 'DRAGON RAGE';
const FONT_TITLE = 'italic 800 132px Inter, Roboto, sans-serif';
const FONT_SUB = '400 64px Inter, Roboto, sans-serif';
const FINAL_R = 96;
let L = null;
function layout() {
  sctx.font = FONT_TITLE;
  const titleW = sctx.measureText(TITLE).width, gap = 120;
  const left = (W - (FINAL_R * 2 + gap + titleW)) / 2, textX = left + FINAL_R * 2 + gap;
  const letters = [...TITLE].map((ch, i) => ({ ch, x: textX + sctx.measureText(TITLE.slice(0, i)).width, w: sctx.measureText(ch).width }));
  L = { ball: { x: left + FINAL_R, y: H / 2 + 6 }, textX, titleW, titleY: H / 2 - 8, subY: H / 2 + 92, letters };
}

// ---------- timeline ----------
const C = { x: W / 2, y: H / 2 };
const T = {
  open: [0, 1.5], glowIn: .3,
  face: [1.5, 1.85],
  launch: [1.85, 2.85], antic: [1.85, 2.02], snap: [2.02, 2.0833], release: 2.0833, ballGone: 2.45,
  sky: [2.85, 3.875], breach: 3.7917,
  space: [3.875, 4.7917],
  insert: [4.7917, 5.0],
  arrive: [5.0, 5.25], hit: 5.25,
};
const HOLD = T.hit + .085;
const DURATION = T.hit + 2.6;
const spinAt = t => { const k = prog(t, T.release, T.hit); return (1 - Math.pow(1 - Math.pow(k, 2.2), 3)) * Math.PI * 2 * 10; };

// ---------- cel-shaded ball ----------
function starPath(cx, cy, r, sx, sy) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    const px = cx + Math.cos(a) * rr * sx, py = cy + Math.sin(a) * rr * sy;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
const STARS = [[-0.30, -0.36], [0.30, -0.36], [-0.30, 0.20], [0.30, 0.20]];
function celBall(r, spin, shineK, o = {}) {
  const ow = Math.max(3, r * .055);
  if (o.silhouette) { ctx.fillStyle = o.silhouette; ctx.beginPath(); ctx.arc(0, 0, r + ow / 2, 0, Math.PI * 2); ctx.fill(); return; }
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = ORANGE; ctx.fillRect(-r, -r, r * 2, r * 2);
  for (const [lon0, lat] of STARS) {
    const lon = lon0 + spin, z = Math.cos(lon) * Math.cos(lat);
    if (z <= .05) continue;
    starPath(Math.sin(lon) * Math.cos(lat) * r, Math.sin(lat) * r, r * .25, Math.max(.08, Math.cos(lon)), Math.cos(lat));
    ctx.fillStyle = RED; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = r * .018; ctx.lineJoin = 'round'; ctx.stroke();
  }
  ctx.beginPath(); ctx.rect(-r, -r, r * 2, r * 2); ctx.arc(-r * .17, -r * .21, r * 1.0, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(190,60,0,.55)'; ctx.fill('evenodd');
  ctx.beginPath(); ctx.rect(-r, -r, r * 2, r * 2); ctx.arc(-r * .3, -r * .36, r * 1.1, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(120,30,0,.35)'; ctx.fill('evenodd');
  if (shineK > 0 && shineK < 1) {
    const p = lerp(-1.6, 1.6, easeInOut(shineK));
    ctx.rotate(-Math.PI / 4); ctx.fillStyle = 'rgba(255,253,240,.95)';
    ctx.fillRect(p * r - r * .16, -r * 2, r * .32, r * 4);
    ctx.fillRect(p * r + r * .24, -r * 2, r * .08, r * 4);
  }
  ctx.restore();
  ctx.save(); ctx.translate(-r * .36, -r * .46); ctx.rotate(-.55);
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.ellipse(0, 0, r * .24, r * .12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(-r * .08, -r * .66, r * .055, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,170,.9)'; ctx.lineWidth = r * .05;
  ctx.beginPath(); ctx.arc(0, 0, r * .9, Math.PI * .1, Math.PI * .4); ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = ow;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
}
function drawBall(x, y, r, t, o = {}) {
  if (r <= .5) return;
  const st = o.stretch || 1, ang = o.ang || 0, sq = o.squash || 0;
  ctx.save(); ctx.translate(x, y);
  ctx.rotate(ang); ctx.scale(st * (1 + sq), (1 - sq) / Math.sqrt(st)); ctx.rotate(-ang);
  celBall(r, spinAt(t), o.shine || 0, o);
  ctx.restore();
}
function glow(x, y, r, s, rad = 2.1) {
  if (s <= 0) return;
  const g = ctx.createRadialGradient(x, y, r * .7, x, y, r * rad);
  g.addColorStop(0, `rgba(255,200,70,${.6 * s})`); g.addColorStop(.45, `rgba(255,160,40,${.2 * s})`); g.addColorStop(1, 'rgba(255,140,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * rad, 0, Math.PI * 2); ctx.fill();
}

// ---------- flat energy trails / aura ----------
function smoothClosed(P) {
  ctx.beginPath();
  const n = P.length, m = i => [(P[i % n][0] + P[(i + 1) % n][0]) / 2, (P[i % n][1] + P[(i + 1) % n][1]) / 2];
  ctx.moveTo(...m(n - 1));
  for (let i = 0; i < n; i++) ctx.quadraticCurveTo(P[i][0], P[i][1], ...m(i));
  ctx.closePath();
}
function ribbonPts(s, t, alpha = 1, cols = [AMBER, YELLOW, WHITE]) {
  if (alpha <= 0 || s.length < 2) return;
  const boil = boilAt(t);
  ctx.save(); ctx.globalAlpha = alpha;
  [[1, cols[0]], [.62, cols[1]], [.26, cols[2]]].forEach(([wm, col]) => {
    const Lp = [], Rp = [];
    for (let i = 0; i < s.length; i++) {
      const p = s[Math.max(0, i - 1)], q = s[Math.min(s.length - 1, i + 1)];
      let nx = -(q.y - p.y), ny = q.x - p.x; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
      const j = 1 + (i % 2 ? .22 : -.08) * (rand(i * 3 + boil * 17 + wm * 5) + .3);
      Lp.push([s[i].x + nx * s[i].w * wm * j, s[i].y + ny * s[i].w * wm * j]);
      Rp.push([s[i].x - nx * s[i].w * wm * (2 - j), s[i].y - ny * s[i].w * wm * (2 - j)]);
    }
    ctx.fillStyle = col; smoothClosed(Lp.concat(Rp.reverse())); ctx.fill();
  });
  ctx.restore();
}
// trail pointing along angle `dir` (radians) behind the ball
function trail(x, y, r, len, dir, t, cols) {
  const pts = [], boil = boilAt(t), dx = Math.cos(dir), dy = Math.sin(dir);
  for (let i = 0; i <= 26; i++) {
    const s = i / 26, wob = Math.sin(s * 6 + boil * 1.3) * r * .14 * s;
    pts.push({ x: x + dx * s * len - dy * wob, y: y + dy * s * len + dx * wob, w: r * .92 * Math.pow(1 - s, .7) });
  }
  ribbonPts(pts, t, 1, cols);
}
function aura(x, y, r, dir, bend, size, t, alpha = 1, cols = [AMBER, YELLOW, WHITE]) {
  if (alpha <= 0 || size <= 0) return;
  const boil = boilAt(t), N = 24;
  ctx.save(); ctx.globalAlpha = alpha;
  [[1, cols[0]], [.68, cols[1]], [.4, cols[2]]].forEach(([ls, col], li) => {
    ctx.beginPath();
    for (let i = 0; i < N * 2; i++) {
      const ang = i / (N * 2) * Math.PI * 2, tip = i % 2 === 0;
      const back = (1 + Math.cos(ang - dir)) / 2;
      let nx = Math.cos(ang), ny = Math.sin(ang), len;
      if (tip) {
        nx = nx * (1 - bend) + Math.cos(dir) * bend * 1.4; ny = ny * (1 - bend) + Math.sin(dir) * bend * 1.4;
        const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
        len = r * size * ls * (.5 + .5 * rand(i * 7 + boil * 13 + li * 101)) * lerp(1, .12 + .88 * back, bend);
      } else len = r * size * ls * .1;
      const px = x + Math.cos(ang) * r * 1.01 + nx * len, py = y + Math.sin(ang) * r * 1.01 + ny * len;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  });
  ctx.restore();
}

// ---------- fx ----------
function focusLines(cx, cy, k, seed, color = '255,250,235', inner = 260, n = 90) {
  if (k <= 0) return;
  ctx.save(); ctx.fillStyle = `rgba(${color},${clamp(k)})`;
  for (let i = 0; i < n; i++) {
    const a = rand(seed + i) * Math.PI * 2, w = .004 + rand(seed + i + 200) * .014;
    const r0 = inner + rand(seed + i + 400) * 380, r1 = 2600;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a - w) * r1, cy + Math.sin(a - w) * r1);
    ctx.lineTo(cx + Math.cos(a + w) * r1, cy + Math.sin(a + w) * r1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function sunburst(cx, cy, c1, c2, n, rot) {
  ctx.save(); ctx.setTransform(SS, 0, 0, SS, 0, 0);
  ctx.fillStyle = c1; ctx.fillRect(0, 0, W, H); ctx.fillStyle = c2;
  for (let i = 0; i < n; i++) {
    const a0 = rot + i / n * Math.PI * 2, a1 = a0 + Math.PI / n;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a0) * 3000, cy + Math.sin(a0) * 3000); ctx.lineTo(cx + Math.cos(a1) * 3000, cy + Math.sin(a1) * 3000); ctx.fill();
  }
  ctx.restore();
}
// vertical speed lines (things rushing downward past the camera)
function speedLinesV(t, k, seed, n = 50, rgb = '255,250,235') {
  if (k <= 0) return;
  ctx.save(); ctx.setTransform(SS, 0, 0, SS, 0, 0);
  const f = boilAt(t * 2);
  for (let i = 0; i < n; i++) {
    const x = rand(seed + i + f * 3) * W, len = 200 + rand(seed + i + 50 + f) * 700, y = rand(seed + i + 3 + f * 7) * (H + len) - len;
    const w = 2 + rand(seed + i + 11) * 7;
    ctx.fillStyle = `rgba(${rgb},${clamp(k) * (.35 + rand(seed + i + 7) * .65)})`;
    ctx.beginPath(); ctx.moveTo(x - w / 2, y); ctx.lineTo(x, y + len); ctx.lineTo(x + w / 2, y); ctx.fill();
  }
  ctx.restore();
}
function ring(x, y, r, lw, a, col = WHITE) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function twinkle(x, y, s, a) {
  if (a <= 0 || s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = clamp(a); ctx.fillStyle = WHITE; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const ang = i / 8 * Math.PI * 2 + Math.PI / 8, rr = i % 2 ? s * .14 : s; ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr); }
  ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
}
function screenFill(col, a) { if (a <= 0) return; ctx.save(); ctx.setTransform(SS, 0, 0, SS, 0, 0); ctx.globalAlpha = clamp(a); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function letterbox(k) { FX.lb = Math.max(FX.lb || 0, k); }

// ---------- camera ----------
function interpKeys(K, t) {
  if (t <= K[0][0]) return K[0].slice(1, 5);
  if (t >= K[K.length - 1][0]) return K[K.length - 1].slice(1, 5);
  let i = 1; while (K[i][0] < t) i++;
  const a = K[i - 1], b = K[i], e = b[5]((t - a[0]) / (b[0] - a[0]));
  return [1, 2, 3, 4].map(j => lerp(a[j], b[j], e));
}
function applyCam(x, y, zoom, rot, sx = 0, sy = 0) {
  ctx.setTransform(SS, 0, 0, SS, 0, 0);
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-x, -y);
}
const shakeXY = (t, s) => { const f = Math.floor(t * 24); return [(rand(f * 3 + 1) - .5) * 2 * s, (rand(f * 3 + 2) - .5) * 1.4 * s]; };

// =====================================================================
// SHOT 1 — the field. The art is placed in "field space": 1080 tall, centered.
// =====================================================================
const HS = H / IH;
const HX = C.x - IW * HS / 2, HY = 0;
const hp = (ix, iy) => ({ x: HX + ix * HS, y: HY + iy * HS });
// the throwing arm (image px): forearm + hand + ball, hinged at the elbow
const ARM_POLY = [[268, 522], [408, 526], [428, 616], [424, 700], [408, 772], [398, 830], [338, 896], [298, 948], [222, 950], [184, 872], [200, 770], [232, 690], [244, 606]];
const ELBOW = [236, 905];
const IMG_BALL = [340, 583], IMG_BALL_R = 54;
const BALL_HOLD = hp(...IMG_BALL), BALL_HOLD_R = IMG_BALL_R * HS;

let BASE_CV = null, ARM_CV = null, ARM_EMPTY_CV = null;
function polyPath(c, P) { c.beginPath(); P.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); }
function prepField() {
  const mkc = () => { const c = document.createElement('canvas'); c.width = IW; c.height = IH; return c; };
  // base: art with the arm area painted over (shirt / sky) and feathered left/right edges
  BASE_CV = mkc();
  let c = BASE_CV.getContext('2d');
  c.drawImage(HERO, 0, 0);
  c.save(); c.filter = 'blur(6px)'; polyPath(c, ARM_POLY); c.fillStyle = '#141417'; c.fill(); c.restore();
  c.save(); polyPath(c, ARM_POLY); c.clip();
  c.beginPath(); c.moveTo(0, 0); c.lineTo(222, 0); c.lineTo(226, 550); c.lineTo(392, 905); c.lineTo(392, IH); c.lineTo(0, IH); c.closePath();
  c.filter = 'blur(4px)'; c.fillStyle = '#6aa6de'; c.fill(); c.restore();
  c.globalCompositeOperation = 'destination-in';
  const g = c.createLinearGradient(0, 0, IW, 0);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.08, 'rgba(0,0,0,1)'); g.addColorStop(.92, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, IW, IH);
  // arm layer with a feathered mask
  const armFrom = (empty) => {
    const cv = mkc(), a = cv.getContext('2d');
    a.drawImage(HERO, 0, 0);
    if (empty) { a.save(); a.beginPath(); a.rect(0, 0, IW, 606); a.clip(); a.beginPath(); a.arc(IMG_BALL[0], IMG_BALL[1], IMG_BALL_R + 9, 0, Math.PI * 2); a.fillStyle = '#141417'; a.fill(); a.restore(); }
    a.globalCompositeOperation = 'destination-in'; a.filter = 'blur(3px)'; polyPath(a, ARM_POLY); a.fillStyle = '#000'; a.fill();
    return cv;
  };
  ARM_CV = armFrom(false); ARM_EMPTY_CV = armFrom(true);
}
// arm pose over time: rotation about the elbow + offset (image px)
function armAt(t) {
  if (t < T.antic[0]) return { rot: Math.sin(t * 2.1) * .012, dx: 0, dy: Math.sin(t * 2.6) * 3 };
  if (t < T.snap[0]) { const k = easeOutCubic(prog(t, ...T.antic)); return { rot: -.1 * k, dx: -8 * k, dy: 34 * k }; }
  if (t < T.snap[1]) { const k = prog(t, ...T.snap); return { rot: lerp(-.1, .34, k), dx: lerp(-8, 30, k), dy: lerp(34, -90, k) }; }
  const k = easeOutCubic(prog(t, T.snap[1], T.snap[1] + .4));
  return { rot: lerp(.34, .1, k), dx: lerp(30, 10, k), dy: lerp(-90, -24, k) };
}
const armXf = (p, a) => {   // image px point -> posed image px
  const dx = p[0] - ELBOW[0], dy = p[1] - ELBOW[1], c = Math.cos(a.rot), s = Math.sin(a.rot);
  return [ELBOW[0] + dx * c - dy * s + a.dx, ELBOW[1] + dx * s + dy * c + a.dy];
};
// body reacts: small crouch on the wind-up, lift on the throw
function bodyAt(t) {
  const breathe = Math.sin(t * 2.6) * .004;
  const crouch = bell(prog(t, T.antic[0], T.snap[1] + .05)) * 10 - bell(prog(t, T.snap[0], T.snap[1] + .35)) * 14;
  return { s: 1 + breathe, dy: crouch };
}
function drawArm(c, a, empty) {
  c.save();
  c.translate(ELBOW[0] + a.dx, ELBOW[1] + a.dy); c.rotate(a.rot); c.translate(-ELBOW[0], -ELBOW[1]);
  c.drawImage(empty ? ARM_EMPTY_CV : ARM_CV, 0, 0);
  c.restore();
}
function drawHero(t, opts = {}) {
  const w = IW * HS, h = IH * HS, b = bodyAt(t), a = armAt(t);
  const released = t >= T.release;
  ctx.save();
  ctx.translate(HX + w / 2, HY + h + b.dy); ctx.scale(b.s, b.s); ctx.translate(-(HX + w / 2), -(HY + h));
  ctx.translate(HX, HY); ctx.scale(HS, HS);
  if (opts.filter) ctx.filter = opts.filter;
  ctx.drawImage(BASE_CV, 0, 0);
  // smear frames during the snap: ghost arms along the swing
  if (t >= T.snap[0] && t < T.snap[1] + .045 && !opts.filter) {
    for (let i = 3; i >= 1; i--) {
      const ga = armAt(t - i * .018);
      ctx.globalAlpha = .28 * (1 - i / 4); drawArm(ctx, ga, ga === a ? released : t - i * .018 >= T.release);
    }
    ctx.globalAlpha = 1;
  }
  drawArm(ctx, a, released);
  ctx.restore();
  return { a, b };
}
function drawField(t) {
  const w = IW * HS, h = IH * HS;
  ctx.save();
  ctx.filter = `blur(${14 * SS}px) brightness(.82) saturate(1.15)`;
  ctx.drawImage(HERO, 0, 0, 150, IH, -700, HY - 30, HX + 760, h + 60);
  ctx.drawImage(HERO, IW - 140, 0, 140, IH, HX + w - 60, HY - 30, HX + 760, h + 60);
  ctx.filter = 'none';
  ctx.restore();
  const g = ctx.createLinearGradient(0, HY - 2400, 0, HY + 40);
  g.addColorStop(0, '#2f6fc8'); g.addColorStop(1, '#5f9fe0');
  ctx.fillStyle = g; ctx.fillRect(-900, HY - 2400, W + 1800, 2402);
  ctx.fillStyle = '#b9a586'; ctx.fillRect(-900, HY + h - 2, W + 1800, 1400);
}
function dust(t) {
  for (let i = 0; i < 26; i++) {
    const x = ((rand(i + 40) * (W + 400) + t * (60 + rand(i) * 140)) % (W + 400)) - 200;
    const y = (rand(i + 80) * H * 1.1 - t * (20 + rand(i + 3) * 40) + H * 2) % (H * 1.1);
    ctx.fillStyle = i % 3 ? 'rgba(210,190,160,.8)' : 'rgba(120,100,80,.9)';

      const y = ((y0 + t * 3000 * (.5 + rand(i + 330))) % (H + 200)) - 100;
      ctx.fillStyle = 'rgba(220,225,255,.7)'; ctx.fillRect(x - 1.5, y - len, 3, len);
    }
  }
  ctx.restore();
}
let K4 = null;
function shotFinal(t) {
  if (!K4) K4 = CAM4();
  const dt = t - T.hit;
  if (dt >= 0 && dt < .085) {
    const white = dt < .042;
    ctx.setTransform(SS, 0, 0, SS, 0, 0);
    ctx.fillStyle = white ? WHITE : '#000'; ctx.fillRect(0, 0, W, H);
    const [cx, cy, z, r] = interpKeys(K4, t); applyCam(cx, cy, z, r, ...shakeXY(t, 20));
    focusLines(L.ball.x, L.ball.y, 1, 5000 + (white ? 0 : 77), white ? '20,12,16' : '255,250,235', 120, 120);
    ctx.save(); ctx.translate(L.ball.x, L.ball.y); celBall(FINAL_R * 1.1, 0, 0, { silhouette: white ? INK : WHITE }); ctx.restore();
    zoomFX(L.ball.x, L.ball.y, .2); FX.ca = 24; FX.warp = 18;
    return;
  }
  let [cx, cy, z, rot] = interpKeys(K4, t);
  const pd = t - HOLD; if (pd >= 0) z *= 1 + .12 * Math.exp(-pd * 14);
  const sh = t >= T.hit ? 30 * Math.exp(-(t - T.hit) * 7) : 10;
  ctx.setTransform(SS, 0, 0, SS, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < T.hit) { sunburst(L.ball.x, L.ball.y, '#0c1026', '#141a38', 26, t); starfield(t, false); speedLinesV(t, 1.2, 2700, 70); }
  else starfield(t, true);
  applyCam(cx, cy, z, rot, ...shakeXY(t, sh));
  const b = posArrive(t);
  if (b && t < T.hit) trail(b.x, b.y + b.r * .2, b.r, 500 + 600 * (1 - prog(t, ...T.arrive)), Math.PI / 2, t);
  if (b) {
    if (t >= T.hit) glow(b.x, b.y, b.r, prog(t, HOLD, HOLD + .6) * (1 + .1 * Math.sin(dt * 5)));
    if (t < T.hit) aura(b.x, b.y, b.r, Math.PI / 2, .75, 1.7, t, 1);
    else aura(b.x, b.y, b.r, 0, 0, .3, t, 1 - prog(t, HOLD, HOLD + .7));
    if (t < T.hit) drawBall(b.x, b.y, b.r, t, { stretch: 1 + .8 * (1 - prog(t, ...T.arrive)), ang: -Math.PI / 2 });
    else drawBall(b.x, b.y, b.r, t, { squash: spring(dt - .085, 34, 9) * .18 });
  }
  drawImpact(t);
  if (t < T.hit) { FX.dirY = 35; zoomFX(L.ball.x, L.ball.y, .12 + .2 * prog(t, ...T.arrive)); FX.ca = 8 + 10 * prog(t, ...T.arrive); FX.warp = 8; }
  else {
    const e = Math.exp(-(t - HOLD) * 7);
    for (const [d, m] of [[0, 4.8], [.07, 3.2]]) { const k = prog(t - HOLD - d, 0, .55); if (k > 0 && k < 1) shock(L.ball.x, L.ball.y, FINAL_R * lerp(1, m, easeOutExpo(k)), 55, .12 * (1 - k)); }
    zoomFX(L.ball.x, L.ball.y, .22 * e); FX.ca = 26 * e; FX.warp = 22 * e;
  }
  drawTitle(t);
  screenFill(WHITE, 1 - prog(t, T.insert[1], T.insert[1] + .085));
  letterbox(1 - easeOutExpo(prog(t, HOLD, HOLD + .5)));
}

// =====================================================================
// POST FX
// =====================================================================
let FX = null;
const resetFX = () => { FX = { zoom: null, dir: 0, dirY: 0, shocks: [], warp: 0, ca: 0, lb: 0 }; };
const scr = (x, y) => { const p = ctx.getTransform().transformPoint(new DOMPoint(x, y)); return { x: p.x, y: p.y }; };
const scrR = (x, y, r) => { const a = scr(x, y), b = scr(x + r, y); return Math.hypot(b.x - a.x, b.y - a.y); };
function shock(x, y, r, w, str) { if (str > .001) { const p = scr(x, y); FX.shocks.push({ x: p.x, y: p.y, r: scrR(x, y, r), w: w * SS, s: str }); } }
function zoomFX(x, y, amt) { if (amt > .002) { const p = scr(x, y); if (!FX.zoom || FX.zoom.amt < amt) FX.zoom = { x: p.x, y: p.y, amt }; } }

function post(t) {
  let src = sceneCv, dst = PA;
  const begin = () => { const c = dst.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.filter = 'none'; c.fillStyle = '#000'; c.fillRect(0, 0, WD, HD); return c; };
  const swap = () => { src = dst; dst = dst === PA ? PB : PA; };
  if ((FX.dir + FX.dirY) * SS > 2) {
    const c = begin(), n = 7, dx = FX.dir * SS, dy = FX.dirY * SS;
    c.drawImage(src, 0, 0);
    for (let i = 1; i <= n; i++) { c.globalAlpha = 1 / (i + 1); c.drawImage(src, -dx * i / n, dy * i / n); }
    swap();
  }
  if (FX.zoom) {
    const c = begin(), n = 8, { x, y, amt } = FX.zoom;
    c.drawImage(src, 0, 0);
    for (let i = 1; i <= n; i++) { const k = 1 + amt * i / n; c.globalAlpha = 1 / (i + 1); c.setTransform(k, 0, 0, k, x * (1 - k), y * (1 - k)); c.drawImage(src, 0, 0); }
    swap();
  }
  if (FX.shocks.length) {
    const c = begin();
    c.drawImage(src, 0, 0);
    for (const sh of FX.shocks) {
      c.save(); c.beginPath(); c.arc(sh.x, sh.y, sh.r + sh.w, 0, Math.PI * 2); c.arc(sh.x, sh.y, Math.max(0, sh.r - sh.w), 0, Math.PI * 2, true); c.clip('evenodd');
      const k = 1 + sh.s; c.setTransform(k, 0, 0, k, sh.x * (1 - k), sh.y * (1 - k)); c.drawImage(src, 0, 0); c.restore();
    }
    swap();
  }
  if (FX.warp > .3) {
    const c = begin(), h = 6 * SS, f = Math.floor(t * 24);
    c.drawImage(src, 0, 0);
    for (let y = 0; y < HD; y += h) {
      const band = Math.floor(y / h);
      const off = FX.warp * SS * (Math.sin(band * .09 + f * 1.7) * .55 + Math.sin(band * .023 - f * .9) * .45 + (rand(band * 7 + f * 131) - .5) * .9);
      c.drawImage(src, 0, y, WD, h, off, y, WD, h);
    }
    swap();
  }
  if (FX.ca > .4) {
    for (const [cv, col] of [[RC, '#f00'], [GC, '#0ff']]) {
      const c = cv.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      c.drawImage(src, 0, 0); c.globalCompositeOperation = 'multiply'; c.fillStyle = col; c.fillRect(0, 0, WD, HD);
    }
    const c = begin(), k = 1 + 2 * FX.ca * SS / WD, cx = FX.zoom ? FX.zoom.x : WD / 2, cy = FX.zoom ? FX.zoom.y : HD / 2;
    c.globalCompositeOperation = 'lighter';
    c.drawImage(GC, 0, 0);
    c.setTransform(k, 0, 0, k, cx * (1 - k), cy * (1 - k)); c.drawImage(RC, 0, 0);
    swap();
  }
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.drawImage(src, 0, 0);
  if (FX.lb > 0) { const h = 90 * FX.lb * SS; octx.fillStyle = '#000'; octx.fillRect(0, 0, WD, h); octx.fillRect(0, HD - h, WD, h); }
}

// ---------- dispatcher ----------
function scene(t) {
  ctx = sctx;
  ctx.setTransform(SS, 0, 0, SS, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < T.face[0]) shotOpen(t);
  else if (t < T.launch[0]) shotFace(t);
  else if (t < T.launch[1]) shotLaunch(t);
  else if (t < T.insert[0]) shotChase(t);
  else if (t < T.insert[1]) shotInsert(t);
  else shotFinal(t);
}
function draw(t) { if (!L) layout(); if (!BASE_CV) prepField(); resetFX(); scene(t); post(t); }

window.draw = draw;
window.DURATION = DURATION;
window.READY = READY;

if (!RENDER) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); out.style.width = W * s + 'px'; out.style.height = H * s + 'px'; };
  addEventListener('resize', fit); fit();
  let start = performance.now(), last = -1;
  const loop = now => {
    let t = (now - start) / 1000; if (t > DURATION + 1) { start = now; t = 0; }
    const f = Math.floor(Math.min(t, DURATION) * 24); if (f !== last) { last = f; draw(f / 24); }
    requestAnimationFrame(loop);
  };
  Promise.all([READY, document.fonts.load(FONT_TITLE)]).then(() => requestAnimationFrame(loop));
}
</script>
