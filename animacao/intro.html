<!doctype html>
<html><head><meta charset="utf-8"><title>Dragon Rage Intro</title>
<style>html,body{margin:0;background:#0e111c;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const BG = '#0e111c';
const DURATION = 4.8;

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutBack = k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeInCubic = k => k * k * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rand(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- final layout (based on the logo) ----------
const FONT_TITLE = 'italic 800 132px Inter, Roboto, sans-serif';
const FONT_SUB = '400 64px Inter, Roboto, sans-serif';
const FINAL_R = 96;
let LAYOUT = null;
function layout() {
  ctx.font = FONT_TITLE;
  const titleW = ctx.measureText('DRAGON RAGE').width;
  const gap = 120;
  const groupW = FINAL_R * 2 + gap + titleW;
  const left = (W - groupW) / 2;
  LAYOUT = {
    ball: { x: left + FINAL_R, y: H / 2 + 6 },
    textX: left + FINAL_R * 2 + gap,
    titleY: H / 2 - 8,
    subY: H / 2 + 92,
  };
}

// ---------- timeline ----------
const T = {
  appear: [0.15, 0.7],
  shine: [0.8, 1.25],
  goRight: [1.35, 1.95],
  passLeft: [2.15, 2.6],
  arrive: [3.0, 3.22],
  spin: [1.35, 3.22],
};

// ball state at time t -> {x, y, r, visible}
function ballAt(t) {
  const C = { x: W / 2, y: H / 2 };
  const R0 = 140;
  if (t < T.appear[0]) return null;
  if (t < T.goRight[0]) {
    const k = prog(t, ...T.appear);
    const s = Math.max(0, easeOutBack(k));
    const bob = Math.sin((t - T.appear[1]) * 6) * 4 * prog(t, T.appear[1], T.appear[1] + .2);
    return { x: C.x, y: C.y + bob, r: R0 * s };
  }
  if (t < T.goRight[1]) {
    const k = easeInCubic(prog(t, ...T.goRight));
    return { x: lerp(C.x, W + 900, k), y: lerp(C.y, C.y + 160, k), r: R0 * lerp(1, 4.2, k) };
  }
  if (t < T.passLeft[0]) return { x: W + 2000, y: 0, r: 0 };
  if (t < T.passLeft[1]) {
    const k = prog(t, ...T.passLeft);
    const kk = k * .85 + easeInOut(k) * .15;
    return { x: lerp(W + 260, -260, kk), y: lerp(430, 560, kk) - Math.sin(kk * Math.PI) * 70, r: 120 };
  }
  if (t < T.arrive[0]) return { x: -2000, y: 0, r: 0 };
  const k = easeOutExpo(prog(t, ...T.arrive));
  const F = LAYOUT.ball;
  return { x: lerp(-180, F.x, k), y: lerp(F.y + 60, F.y, k), r: lerp(FINAL_R * 1.25, FINAL_R, k) };
}

// spin angle (ends on an exact multiple of 2π so stars rest in the logo pose)
function spinAt(t) {
  const k = prog(t, ...T.spin);
  return easeInOut(k) * Math.PI * 2 * 9;
}

// ---------- drawing ----------
function starPath(cx, cy, r, sx, sy, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5 + rot;
    const rr = i % 2 ? r * 0.45 : r;
    const px = cx + Math.cos(a) * rr * sx, py = cy + Math.sin(a) * rr * sy;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}

const STARS = [ // lon, lat (radians) — 2x2 like the logo, slightly above center
  [-0.30, -0.36], [0.30, -0.36], [-0.30, 0.20], [0.30, 0.20],
];

function drawGlow(x, y, r, strength) {
  if (strength <= 0) return;
  const g = ctx.createRadialGradient(x, y, r * .8, x, y, r * 2.1);
  g.addColorStop(0, `rgba(255,200,70,${.55 * strength})`);
  g.addColorStop(.45, `rgba(255,170,40,${.18 * strength})`);
  g.addColorStop(1, 'rgba(255,150,30,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, Math.PI * 2); ctx.fill();
}

function drawBall(x, y, r, spin, shineK) {
  if (r <= 0.5) return;
  // body
  const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r * 1.05);
  g.addColorStop(0, '#ffd36a');
  g.addColorStop(.45, '#ffa51f');
  g.addColorStop(.85, '#e9770a');
  g.addColorStop(1, '#c45a05');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();

  // stars on the rotating sphere
  for (const [lon0, lat] of STARS) {
    const lon = lon0 + spin;
    const z = Math.cos(lon) * Math.cos(lat);
    if (z <= 0.02) continue;
    const sx = Math.sin(lon) * Math.cos(lat), sy = Math.sin(lat);
    const fx = Math.cos(lon), fy = Math.cos(lat);
    ctx.globalAlpha = clamp(z * 3);
    ctx.fillStyle = '#d8261c';
    starPath(x + sx * r, y + sy * r, r * 0.25, Math.max(.05, fx), fy, 0);
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,20,10,.55)'; ctx.lineWidth = r * .012; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // rim shading
  const rim = ctx.createRadialGradient(x, y, r * .7, x, y, r);
  rim.addColorStop(0, 'rgba(160,60,0,0)');
  rim.addColorStop(1, 'rgba(150,50,0,.35)');
  ctx.fillStyle = rim; ctx.fillRect(x - r, y - r, r * 2, r * 2);

  // shine sweep
  if (shineK > 0 && shineK < 1) {
    const p = lerp(-1.6, 1.6, easeInOut(shineK));
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-Math.PI / 4);
    const sg = ctx.createLinearGradient(p * r - r * .45, 0, p * r + r * .45, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(.5, 'rgba(255,255,240,.85)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(-r * 2, -r * 2, r * 4, r * 4);
    ctx.restore();
  }
  ctx.restore();

  // specular highlight (fixed light source)
  ctx.save();
  ctx.translate(x - r * .32, y - r * .5);
  ctx.rotate(-0.35);
  const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, r * .3);
  hg.addColorStop(0, 'rgba(255,255,255,.95)');
  hg.addColorStop(.6, 'rgba(255,255,255,.55)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.scale(1, .55);
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, r * .3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// trail: sample past positions
function drawTrail(t, win, widthMul, alphaMul) {
  const N = 40;
  for (let i = N; i >= 1; i--) {
    const age = (i / N) * win;
    const b0 = ballAt(t - age), b1 = ballAt(t - age + win / N);
    if (!b0 || !b1 || b0.r < 1 || b1.r < 1) continue;
    if (Math.abs(b0.x - b1.x) > 900) continue;
    const k = 1 - i / N;
    ctx.strokeStyle = `rgba(255,${Math.round(lerp(120, 220, k))},${Math.round(lerp(20, 120, k))},${k * k * alphaMul})`;
    ctx.lineWidth = b0.r * 2 * widthMul * lerp(.25, 1, k);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b0.x, b0.y); ctx.lineTo(b1.x, b1.y); ctx.stroke();
  }
}

function drawSpeedLines(t, k, dir) {
  if (k <= 0) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    const y = rand(i) * H;
    const len = 200 + rand(i + 50) * 500;
    const speed = 3500 + rand(i + 9) * 3000;
    let x = ((rand(i + 3) * W * 2 + t * speed) % (W + len * 2)) - len;
    if (dir < 0) x = W - x;
    ctx.strokeStyle = `rgba(255,230,180,${.12 * k * (0.4 + rand(i + 7) * .6)})`;
    ctx.lineWidth = 1 + rand(i + 11) * 3;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * dir, y); ctx.stroke();
  }
  ctx.restore();
}

function drawImpact(t) {
  const t0 = T.arrive[1] - 0.02;
  const dt = t - t0;
  if (dt < 0) return;
  const { x, y } = LAYOUT.ball;
  const R = FINAL_R;

  // flash
  const fk = 1 - prog(dt, 0, .35);
  if (fk > 0) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, R * 5);
    g.addColorStop(0, `rgba(255,255,235,${.95 * fk})`);
    g.addColorStop(.25, `rgba(255,220,120,${.6 * fk})`);
    g.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R * 5, 0, Math.PI * 2); ctx.fill();
  }
  // light rays
  const rk = prog(dt, 0, .55);
  if (rk < 1) {
    ctx.save(); ctx.translate(x, y);
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2 + rand(i) * .3;
      const len = R * (2.2 + rand(i + 20) * 2.5) * easeOutCubic(rk);
      const w = (6 + rand(i + 40) * 10) * (1 - rk);
      ctx.rotate(0); ctx.save(); ctx.rotate(a);
      const lg = ctx.createLinearGradient(R, 0, R + len, 0);
      lg.addColorStop(0, `rgba(255,240,190,${.9 * (1 - rk)})`);
      lg.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.moveTo(R * .9, -w); ctx.lineTo(R + len, 0); ctx.lineTo(R * .9, w); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // shockwave rings
  for (const [delay, maxR, lw] of [[0, 3.6, 10], [.08, 2.6, 5]]) {
    const k = prog(dt - delay, 0, .5);
    if (k <= 0 || k >= 1) continue;
    ctx.strokeStyle = `rgba(255,225,140,${(1 - k) * .9})`;
    ctx.lineWidth = lw * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(x, y, R * lerp(1, maxR, easeOutCubic(k)), 0, Math.PI * 2); ctx.stroke();
  }
  // sparks
  const sk = prog(dt, 0, .7);
  if (sk < 1) {
    for (let i = 0; i < 28; i++) {
      const a = rand(i + 100) * Math.PI * 2;
      const sp = R * (2 + rand(i + 200) * 3.2);
      const d = R + sp * easeOutCubic(sk);
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d + sk * sk * 40;
      const sz = (2 + rand(i + 300) * 4) * (1 - sk);
      ctx.fillStyle = `rgba(255,${200 + Math.round(rand(i) * 55)},120,${1 - sk})`;
      ctx.beginPath(); ctx.arc(px, py, sz, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawText(t) {
  const t0 = T.arrive[1];
  const k1 = prog(t, t0 - .02, t0 + .25);
  if (k1 > 0) {
    const e = easeOutExpo(k1);
    ctx.save();
    ctx.globalAlpha = clamp(k1 * 2.5);
    ctx.font = FONT_TITLE;
    ctx.textBaseline = 'alphabetic';
    const x = LAYOUT.textX + (1 - e) * 140;
    // flash-white then settle to yellow
    const wk = 1 - prog(t, t0 + .05, t0 + .45);
    ctx.shadowColor = `rgba(255,210,80,${.6 * wk})`;
    ctx.shadowBlur = 40 * wk;
    ctx.fillStyle = `rgb(${Math.round(lerp(255, 255, wk))},${Math.round(lerp(212, 250, wk))},${Math.round(lerp(77, 220, wk))})`;
    ctx.fillText('DRAGON RAGE', x, LAYOUT.titleY);
    ctx.restore();
  }
  const k2 = prog(t, t0 + .18, t0 + .55);
  if (k2 > 0) {
    ctx.save();
    ctx.globalAlpha = easeOutCubic(k2);
    ctx.font = FONT_SUB;
    ctx.fillStyle = '#c5c8de';
    ctx.fillText('Escolha o jogo', LAYOUT.textX + 4, LAYOUT.subY + (1 - easeOutCubic(k2)) * 24);
    ctx.restore();
  }
}

function draw(t) {
  if (!LAYOUT) layout();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

  // screen shake on impact
  const sdt = t - T.arrive[1];
  if (sdt > 0 && sdt < .25) {
    const a = (1 - sdt / .25) * 12;
    ctx.translate(Math.sin(sdt * 90) * a, Math.cos(sdt * 77) * a * .6);
  }

  // vignette-ish ambient
  const amb = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W * .7);
  amb.addColorStop(0, 'rgba(40,46,80,.25)'); amb.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = amb; ctx.fillRect(-50, -50, W + 100, H + 100);

  // speed lines during the fast passes
  drawSpeedLines(t, Math.sin(prog(t, T.goRight[0] + .25, T.goRight[1]) * Math.PI) * .7, 1);
  drawSpeedLines(t, Math.sin(prog(t, T.passLeft[0], T.passLeft[1] + .15) * Math.PI), -1);

  // trails
  if (t > T.goRight[0] && t < T.passLeft[0]) drawTrail(t, .07, .35, .55);
  if (t > T.passLeft[0] && t < T.arrive[0]) {
    const fade = 1 - prog(t, T.passLeft[1], T.passLeft[1] + .3);
    drawTrail(t, .2, .9, .85 * fade);
  }
  if (t > T.arrive[0] && t < T.arrive[1] + .1) drawTrail(t, .06, .8, .8);

  const b = ballAt(t);
  if (b && b.r > 0.5 && b.x > -b.r * 3 && b.x < W + b.r * 3) {
    let glow = 1;
    if (t < T.goRight[0]) glow = prog(t, T.appear[0] + .1, T.appear[1]);
    if (t >= T.arrive[1]) glow = 1 + .12 * Math.sin((t - T.arrive[1]) * 5);
    drawGlow(b.x, b.y, b.r, glow);
    drawBall(b.x, b.y, b.r, spinAt(t), prog(t, ...T.shine));
  }

  drawImpact(t);
  drawText(t);
}

window.draw = draw;
window.DURATION = DURATION;

// live preview when opened in a browser
if (!new URLSearchParams(location.search).has('render')) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; };
  addEventListener('resize', fit); fit();
  let start = performance.now();
  const loop = now => { let t = (now - start) / 1000; if (t > DURATION + 1) { start = now; t = 0; } draw(Math.min(t, DURATION)); requestAnimationFrame(loop); };
  document.fonts.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body></html>
