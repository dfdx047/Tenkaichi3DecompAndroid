<!doctype html>
<html><head><meta charset="utf-8"><title>Dragon Rage Intro</title>
<style>html,body{margin:0;background:#0e111c;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 2D anime-style (cel shaded, ink outlines, flat colors) intro. Rendered at 24 fps.
const W = 1920, H = 1080;
const out = document.getElementById('c');
const octx = out.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const sceneCv = mk(), textCv = mk();
const sctx = sceneCv.getContext('2d'), tctx = textCv.getContext('2d');
let ctx = sctx;

const BG = '#0e111c', INK = '#140c10', ORANGE = '#ffa21a', YELLOW = '#ffd23f', WHITE = '#fffbea', AMBER = '#ff8a00', RED = '#d9271c';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOutBack = (k, c1 = 2.2) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeInQuad = k => k * k;
const easeInCubic = k => k * k * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeOutQuart = k => 1 - Math.pow(1 - k, 4);
const easeOutExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const linear = k => k;
const rand = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const spring = (dt, freq = 22, damp = 7) => dt < 0 ? 0 : Math.exp(-damp * dt) * Math.cos(freq * dt);
const bell = k => Math.sin(clamp(k) * Math.PI);
const boilAt = t => Math.floor(t * 12);          // drawings "boil" on twos

// ---------- final layout (matches the logo) ----------
const TITLE = 'DRAGON RAGE';
const FONT_TITLE = 'italic 800 132px Inter, Roboto, sans-serif';
const FONT_SUB = '400 64px Inter, Roboto, sans-serif';
const FINAL_R = 96;
let L = null;
function layout() {
  sctx.font = FONT_TITLE;
  const titleW = sctx.measureText(TITLE).width, gap = 120;
  const left = (W - (FINAL_R * 2 + gap + titleW)) / 2, textX = left + FINAL_R * 2 + gap;
  const letters = [...TITLE].map((ch, i) => ({ ch, x: textX + sctx.measureText(TITLE.slice(0, i)).width, w: sctx.measureText(ch).width }));
  L = { ball: { x: left + FINAL_R, y: H / 2 + 6 }, textX, titleW, titleY: H / 2 - 8, subY: H / 2 + 92, letters };
}

// ---------- timeline (shared with audio.py) ----------
const C = { x: W / 2, y: H / 2 };
const R0 = 140;
const T = {
  charge: [0, .45], appear: [.45, .72], shine: [.88, 1.18],
  antic: [1.35, 1.5], launch: [1.5, 1.85],
  side1: [1.85, 3.4], insert1: [2.5, 2.68], boom1: 2.95,
  front: [3.4, 3.95],
  side2: [3.95, 5.0], boom2: 4.2, insert2: [4.33, 4.5], surge: [4.6, 4.88],
  arrive: [5.12, 5.33], hit: 5.33,
};
const HOLD = T.hit + .085;
const DURATION = 7.9;
const spinAt = t => { const k = prog(t, T.antic[0], T.hit); return (1 - Math.pow(1 - Math.pow(k, 2.2), 3)) * Math.PI * 2 * 10; };

// ---------- cel-shaded ball ----------
function starPath(cx, cy, r, sx, sy) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    const px = cx + Math.cos(a) * rr * sx, py = cy + Math.sin(a) * rr * sy;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
const STARS = [[-0.30, -0.36], [0.30, -0.36], [-0.30, 0.20], [0.30, 0.20]];

function celBall(r, spin, shineK, o = {}) {
  const ow = Math.max(3, r * .05);
  if (o.silhouette) { ctx.fillStyle = o.silhouette; ctx.beginPath(); ctx.arc(0, 0, r + ow / 2, 0, Math.PI * 2); ctx.fill(); return; }
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = ORANGE; ctx.fillRect(-r, -r, r * 2, r * 2);
  for (const [lon0, lat] of STARS) {
    const lon = lon0 + spin, z = Math.cos(lon) * Math.cos(lat);
    if (z <= .05) continue;
    starPath(Math.sin(lon) * Math.cos(lat) * r, Math.sin(lat) * r, r * .25, Math.max(.08, Math.cos(lon)), Math.cos(lat));
    ctx.fillStyle = RED; ctx.fill();
    ctx.strokeStyle = INK; ctx.lineWidth = r * .018; ctx.lineJoin = 'round'; ctx.stroke();
  }
  // hard cel shadow crescent
  ctx.beginPath(); ctx.rect(-r, -r, r * 2, r * 2); ctx.arc(-r * .17, -r * .21, r * 1.0, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(190,60,0,.55)'; ctx.fill('evenodd');
  // second, deeper core shadow
  ctx.beginPath(); ctx.rect(-r, -r, r * 2, r * 2); ctx.arc(-r * .3, -r * .36, r * 1.1, 0, Math.PI * 2, true);
  ctx.fillStyle = 'rgba(120,30,0,.35)'; ctx.fill('evenodd');
  if (shineK > 0 && shineK < 1) {
    const p = lerp(-1.6, 1.6, easeInOut(shineK));
    ctx.rotate(-Math.PI / 4); ctx.fillStyle = 'rgba(255,253,240,.95)';
    ctx.fillRect(p * r - r * .16, -r * 2, r * .32, r * 4);
    ctx.fillRect(p * r + r * .24, -r * 2, r * .08, r * 4);
  }
  ctx.restore();
  // hard highlight
  ctx.save(); ctx.translate(-r * .36, -r * .46); ctx.rotate(-.55);
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.ellipse(0, 0, r * .24, r * .12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(-r * .08, -r * .66, r * .055, 0, Math.PI * 2); ctx.fill();
  // rim light
  ctx.strokeStyle = 'rgba(255,240,170,.9)'; ctx.lineWidth = r * .05;
  ctx.beginPath(); ctx.arc(0, 0, r * .9, Math.PI * .1, Math.PI * .4); ctx.stroke();
  // ink outline
  ctx.strokeStyle = INK; ctx.lineWidth = ow;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
}

function drawBall(x, y, r, t, o = {}) {
  if (r <= .5) return;
  const st = o.stretch || 1, ang = o.ang || 0, sq = o.squash || 0;
  ctx.save(); ctx.translate(x, y);
  ctx.rotate(ang); ctx.scale(st * (1 + sq), (1 - sq) / Math.sqrt(st)); ctx.rotate(-ang);
  celBall(r, spinAt(t), o.shine || 0, o);
  ctx.restore();
}
function drawBallFn(pos, t, b, o = {}) {
  const p = pos(t - 1 / 240);
  let ang = 0, st = 1;
  if (p && Math.abs(p.x - b.x) < 600) {
    const vx = (b.x - p.x) * 240, vy = (b.y - p.y) * 240;
    ang = Math.atan2(vy, vx); st = 1 + clamp(Math.hypot(vx, vy) / 9000, 0, .6);
  }
  drawBall(b.x, b.y, b.r, t, { ...o, ang, stretch: st });
}
// flat smear ghosts
function ghostsFn(pos, t, n, step) {
  const now = pos(t);
  for (let i = n; i >= 1; i--) {
    const b = pos(t - i * step);
    if (!b || !now || Math.abs(b.x - now.x) > 900 || b.r < 2) continue;
    ctx.fillStyle = i % 2 ? 'rgba(255,170,40,.55)' : 'rgba(255,220,90,.45)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (1 - i * .08), 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- flat energy trails ----------
function ribbonPts(s, t, alpha = 1) {
  if (alpha <= 0 || s.length < 2) return;
  const boil = boilAt(t);
  ctx.save(); ctx.globalAlpha = alpha;
  for (const [wm, col] of [[1, AMBER], [.62, YELLOW], [.26, WHITE]]) {
    const Lp = [], Rp = [];
    for (let i = 0; i < s.length; i++) {
      const p = s[Math.max(0, i - 1)], q = s[Math.min(s.length - 1, i + 1)];
      let nx = -(q.y - p.y), ny = q.x - p.x; const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
      const j = 1 + (i % 2 ? .28 : -.12) * (rand(i * 3 + boil * 17 + wm * 5) + .3);
      Lp.push([s[i].x + nx * s[i].w * wm * j, s[i].y + ny * s[i].w * wm * j]);
      Rp.push([s[i].x - nx * s[i].w * wm * (2 - j), s[i].y - ny * s[i].w * wm * (2 - j)]);
    }
    ctx.fillStyle = col; ctx.beginPath();
    Lp.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    for (let i = Rp.length - 1; i >= 0; i--) ctx.lineTo(...Rp[i]);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function ribbonFn(pos, t, win, widthMul, alpha = 1) {
  const N = 26, pts = [];
  for (let i = 0; i <= N; i++) {
    const b = pos(t - i / N * win);
    if (!b || b.r < 2) break;
    if (pts.length && Math.hypot(b.x - pts[pts.length - 1].x, b.y - pts[pts.length - 1].y) > 700) break;
    pts.push({ x: b.x, y: b.y, w: b.r * widthMul * Math.pow(1 - i / N, .8) });
  }
  ribbonPts(pts, t, alpha);
}
function streamTrail(x, y, r, len, t) {
  const pts = [], boil = boilAt(t);
  for (let i = 0; i <= 26; i++) {
    const s = i / 26;
    pts.push({ x: x - s * len, y: y + Math.sin(s * 6 + boil * 1.3) * r * .14 * s, w: r * .92 * Math.pow(1 - s, .7) });
  }
  ribbonPts(pts, t);
}

// ---------- flat spiky ki aura ----------
function aura(x, y, r, dir, bend, size, t, alpha = 1) {
  if (alpha <= 0 || size <= 0) return;
  const boil = boilAt(t), N = 24;
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineJoin = 'miter';
  [[1, AMBER], [.68, YELLOW], [.4, WHITE]].forEach(([ls, col], li) => {
    ctx.beginPath();
    for (let i = 0; i < N * 2; i++) {
      const ang = i / (N * 2) * Math.PI * 2, tip = i % 2 === 0;
      const back = (1 + Math.cos(ang - dir)) / 2;
      let nx = Math.cos(ang), ny = Math.sin(ang), len;
      if (tip) {
        nx = nx * (1 - bend) + Math.cos(dir) * bend * 1.4; ny = ny * (1 - bend) + Math.sin(dir) * bend * 1.4;
        const d = Math.hypot(nx, ny) || 1; nx /= d; ny /= d;
        len = r * size * ls * (.5 + .5 * rand(i * 7 + boil * 13 + li * 101)) * lerp(1, .12 + .88 * back, bend);
      } else len = r * size * ls * .1;
      const px = x + Math.cos(ang) * r * 1.01 + nx * len, py = y + Math.sin(ang) * r * 1.01 + ny * len;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  });
  ctx.restore();
}

// ---------- fx ----------
function focusLines(cx, cy, k, seed, color = '255,250,235', inner = 260, n = 90) {
  if (k <= 0) return;
  ctx.save(); ctx.fillStyle = `rgba(${color},${clamp(k)})`;
  for (let i = 0; i < n; i++) {
    const a = rand(seed + i) * Math.PI * 2, w = .004 + rand(seed + i + 200) * .014;
    const r0 = inner + rand(seed + i + 400) * 380, r1 = 2600;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
    ctx.lineTo(cx + Math.cos(a - w) * r1, cy + Math.sin(a - w) * r1);
    ctx.lineTo(cx + Math.cos(a + w) * r1, cy + Math.sin(a + w) * r1);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function sunburst(cx, cy, c1, c2, n, rot) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = c1; ctx.fillRect(0, 0, W, H); ctx.fillStyle = c2;
  for (let i = 0; i < n; i++) {
    const a0 = rot + i / n * Math.PI * 2, a1 = a0 + Math.PI / n;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a0) * 3000, cy + Math.sin(a0) * 3000); ctx.lineTo(cx + Math.cos(a1) * 3000, cy + Math.sin(a1) * 3000); ctx.fill();
  }
  ctx.restore();
}
function speedLines(t, k, dir, seed, n = 40, rgb = '255,250,235') {
  if (k <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const f = boilAt(t * 2);
  for (let i = 0; i < n; i++) {
    const y = rand(seed + i + f * 3) * H, len = 250 + rand(seed + i + 50 + f) * 800, x = rand(seed + i + 3 + f * 7) * (W + len) - len;
    const w = 2 + rand(seed + i + 11) * 7;
    ctx.fillStyle = `rgba(${rgb},${clamp(k) * (.35 + rand(seed + i + 7) * .65)})`;
    ctx.beginPath();
    if (dir < 0) { ctx.moveTo(x, y - w / 2); ctx.lineTo(x + len, y); ctx.lineTo(x, y + w / 2); }
    else { ctx.moveTo(x + len, y - w / 2); ctx.lineTo(x, y); ctx.lineTo(x + len, y + w / 2); }
    ctx.fill();
  }
  ctx.restore();
}
function ring(x, y, r, lw, a, col = WHITE) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function twinkle(x, y, s, a) {
  if (a <= 0 || s <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = clamp(a); ctx.fillStyle = WHITE; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const ang = i / 8 * Math.PI * 2 + Math.PI / 8, rr = i % 2 ? s * .14 : s; ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr); }
  ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
}
function screenFill(col, a) { if (a <= 0) return; ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = clamp(a); ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function letterbox(k) { // cinematic bars that snap in during action
  if (k <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000';
  const h = 90 * k; ctx.fillRect(0, 0, W, h); ctx.fillRect(0, H - h, W, h); ctx.restore();
}

// ---------- camera ----------
function interpKeys(K, t) {
  if (t <= K[0][0]) return K[0].slice(1, 5);
  if (t >= K[K.length - 1][0]) return K[K.length - 1].slice(1, 5);
  let i = 1; while (K[i][0] < t) i++;
  const a = K[i - 1], b = K[i], e = b[5]((t - a[0]) / (b[0] - a[0]));
  return [1, 2, 3, 4].map(j => lerp(a[j], b[j], e));
}
function applyCam(x, y, zoom, rot, sx = 0, sy = 0) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-x, -y);
}
// jittery hand-animated shake (new offset every frame)
const shakeXY = (t, s) => { const f = Math.floor(t * 24); return [(rand(f * 3 + 1) - .5) * 2 * s, (rand(f * 3 + 2) - .5) * 1.4 * s]; };

function dotsBackdrop(t, cx, cy, zoom, rot) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2);
  for (const [depth, n, size, col, seed] of [[.4, 40, 3, 'rgba(120,130,220,.35)', 0], [1, 30, 4, 'rgba(220,225,255,.45)', 100]]) {
    const span = W + 800, spanY = H + 800;
    for (let i = 0; i < n; i++) {
      let x = (rand(seed + i) * span * 2 - (cx - C.x) * depth * zoom) % span; if (x < 0) x += span;
      let y = (rand(seed + i + 50) * spanY * 2 - (cy - C.y) * depth * zoom) % spanY; if (y < 0) y += spanY;
      ctx.fillStyle = col; ctx.fillRect(x - 400, y - 400, size, size);
    }
  }
  ctx.restore();
}

// =====================================================================
// SHOT 1 — awakening + launch into the lens
// =====================================================================
const CAM1 = [
  [0.00, C.x, C.y, .9, -.05, null],
  [0.45, C.x, C.y, 1.16, .03, easeInQuad],
  [0.50, C.x, C.y, 1.45, -.04, easeOutExpo],
  [0.75, C.x, C.y, 1.22, .03, easeOutCubic],
  [1.18, C.x + 25, C.y - 12, 1.55, -.04, easeInOut],
  [1.35, C.x + 10, C.y - 5, 1.45, .02, easeOutCubic],
  [1.50, C.x - 90, C.y + 10, .95, -.14, easeOutExpo],
  [1.85, C.x + 120, C.y + 40, 1.15, .1, easeInCubic],
];
function pos1(t) {
  if (t < T.appear[0]) return null;
  if (t < T.antic[0]) {
    const s = Math.max(0, easeOutBack(prog(t, ...T.appear), 3));
    const bob = Math.sin((t - T.appear[1]) * 6) * 6 * prog(t, T.appear[1], T.appear[1] + .2);
    return { x: C.x, y: C.y + bob, r: R0 * s };
  }
  if (t < T.launch[0]) { const k = easeOutCubic(prog(t, ...T.antic)); return { x: C.x - 60 * k, y: C.y + 12 * k, r: R0 * lerp(1, .85, k) }; }
  const e = easeInCubic(prog(t, ...T.launch));
  return { x: lerp(C.x - 60, C.x + 240, e), y: lerp(C.y + 12, C.y + 90, e), r: R0 * lerp(.85, 17, e) };
}
function shot1(t) {
  // pop frames: flat orange burst panel
  const popK = t - T.appear[0];
  if (popK >= 0 && popK < .085) {
    sunburst(C.x, C.y, AMBER, YELLOW, 24, popK * 3);
    const [cx, cy, z, rot] = interpKeys(CAM1, t); applyCam(cx, cy, z, rot);
    focusLines(C.x, C.y, 1, 900, '20,12,16', 180);
    const b = pos1(t); if (b) drawBall(b.x, b.y, Math.max(b.r, 60), t, { silhouette: INK });
    return;
  }
  let [cx, cy, z, rot] = interpKeys(CAM1, t);
  let sh = 0;
  const ap = prog(t, T.appear[0], T.appear[0] + .25); if (ap > 0 && ap < 1) sh = 22 * (1 - ap);
  const lk = prog(t, ...T.launch); if (lk > 0) sh = Math.max(sh, 26 * lk);
  if (t > T.antic[0] && t < T.antic[0] + .08) sh = 14;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  dotsBackdrop(t, cx, cy, z, rot);
  speedLines(t, lk * 1.3, 1, 2100);
  applyCam(cx, cy, z, rot, ...shakeXY(t, sh));
  // charge: flat energy streaks converging
  const ck = prog(t, ...T.charge);
  if (ck > 0 && t < T.appear[0]) {
    ctx.save(); ctx.lineCap = 'butt';
    for (let i = 0; i < 60; i++) {
      const a = rand(i + 700) * Math.PI * 2, d0 = 320 + rand(i + 800) * 700, st = rand(i + 900) * .45, kk = clamp((ck - st) / (1 - st));
      if (kk <= 0) continue;
      const d = d0 * (1 - easeInQuad(kk)), d2 = d + 50 + 170 * kk;
      ctx.strokeStyle = i % 3 ? YELLOW : WHITE; ctx.lineWidth = 3 + rand(i) * 4;
      ctx.beginPath(); ctx.moveTo(C.x + Math.cos(a) * d, C.y + Math.sin(a) * d); ctx.lineTo(C.x + Math.cos(a) * d2, C.y + Math.sin(a) * d2); ctx.stroke();
    }
    const core = 6 + easeInCubic(ck) * 50;
    ctx.fillStyle = YELLOW; ctx.beginPath(); ctx.arc(C.x, C.y, core * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(C.x, C.y, core, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const b = pos1(t);
  focusLines(b ? b.x : C.x, b ? b.y : C.y, bell(prog(t, T.launch[0], T.launch[1] + .2)) * 1.2, 1000, '255,250,235', 300);
  if (b && b.r > .5) {
    if (t > T.launch[0]) { ribbonFn(pos1, t, .08, .6); ghostsFn(pos1, t, 3, .02); }
    const ak = prog(t, T.shine[1], T.antic[1]);
    aura(b.x, b.y, b.r, 0, 0, .45 * ak + .3 * lk, t, ak > 0 ? 1 : 0);
    drawBallFn(pos1, t, b, { shine: prog(t, ...T.shine) });
  }
  // pop rings
  const dk = prog(t, T.appear[0] + .085, T.appear[0] + .5);
  if (dk > 0 && dk < 1) {
    ring(C.x, C.y, R0 * lerp(1.1, 3.6, easeOutExpo(dk)), 22 * (1 - dk) + 2, 1 - dk, WHITE);
    ring(C.x, C.y, R0 * lerp(1, 2.3, easeOutExpo(prog(dk, .1, 1))), 10 * (1 - dk) + 2, 1 - dk, YELLOW);
  }
  const tk = prog(t, T.shine[1] - .05, T.shine[1] + .2);
  twinkle(C.x + R0 * .6, C.y - R0 * .65, 95 * bell(tk), 1);
  screenFill(AMBER, prog(t, 1.74, 1.79));
  screenFill(WHITE, prog(t, 1.79, 1.82));
  letterbox(easeOutExpo(prog(t, T.antic[0], T.antic[0] + .1)));
}

// =====================================================================
// SIDE TRACKING SHOTS
// =====================================================================
function speedAt(t) {
  if (t < T.side1[1]) return lerp(.05, .55, easeInQuad(prog(t, ...T.side1)));
  return lerp(.7, 1, easeOutCubic(prog(t, T.side2[0], T.surge[0])));
}
const VMAX = 15000;
function scrollAt(t) {
  const t0 = t < T.side1[1] ? T.side1[0] : T.side2[0], n = 40, dt = (t - t0) / n;
  let s = 0; for (let i = 0; i < n; i++) s += speedAt(t0 + (i + .5) * dt) * VMAX * dt;
  return s;
}
function sidePos(t) {
  if (t < T.side1[1]) {
    const k = prog(t, ...T.side1);
    return { x: lerp(700, 860, easeOutCubic(k)) + Math.sin(t * 2.3) * 18, y: 560 + Math.sin(t * 6.5) * 14 * (1 - speedAt(t)), r: 150 };
  }
  const s = easeInCubic(prog(t, ...T.surge));
  return { x: 880 + Math.sin(t * 9) * 10 + s * 1900, y: 545 + Math.sin(t * 13) * 6 - s * 40, r: 150 };
}
function sideBackground(t, sp, scroll, hot) {
  // flat sky bands
  const base = hot ? '#2b0b24' : '#121833', band = hot ? '#3d1031' : '#1a2245', band2 = hot ? '#521741' : '#222c58';
  ctx.fillStyle = base; ctx.fillRect(-300, -300, W + 600, H + 600);
  for (const [y, h, col] of [[140, 90, band], [690, 150, band], [880, 70, band2], [300, 40, band2]]) {
    ctx.fillStyle = col; ctx.fillRect(-300, y, W + 600, h);
  }
  // streaks (flat, tapered)
  for (const [depth, n, lw, col, seed] of [[.15, 70, 3, hot ? 'rgba(255,190,120,.55)' : 'rgba(190,205,255,.55)', 0], [.5, 40, 5, hot ? 'rgba(255,220,120,.7)' : 'rgba(225,230,255,.6)', 300], [1.2, 16, 9, hot ? 'rgba(255,240,180,.8)' : 'rgba(255,245,220,.7)', 600]]) {
    const span = W + 1400;
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const x0 = rand(seed + i) * span, y = rand(seed + i + 50) * (H + 200) - 100;
      const x = ((x0 - scroll * depth) % span + span) % span - 700;
      const len = 10 + sp * VMAX * depth * .03 * (.6 + rand(seed + i + 9) * .8), w = lw * (.6 + rand(seed + i + 3) * .8);
      ctx.beginPath(); ctx.moveTo(x, y - w / 2); ctx.lineTo(x + len, y); ctx.lineTo(x, y + w / 2); ctx.closePath(); ctx.fill();
    }
  }
}
function foregroundDebris(t, sp, scroll) {
  const span = W * 2.6;
  for (let i = 0; i < 5; i++) {
    const x0 = rand(i + 1200) * span, y = rand(i + 1210) < .5 ? 40 + rand(i + 1220) * 140 : H - 40 - rand(i + 1220) * 140;
    const x = ((x0 - scroll * 3.2) % span + span) % span - 500;
    const r = 80 + rand(i + 1230) * 120, st = 1 + sp * 3.5;
    ctx.save(); ctx.translate(x, y); ctx.scale(st, 1 / Math.sqrt(st) + .3);
    ctx.fillStyle = '#06040a'; ctx.beginPath();
    for (let j = 0; j < 9; j++) { const a = j / 9 * Math.PI * 2, rr = r * (.7 + rand(i * 9 + j) * .4); j ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,60,.7)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.restore();
  }
}
function sideSparks(t, shotStart, scroll) {
  for (let i = 0; i < 80; i++) {
    const ts = shotStart + rand(i + 3000) * 1.6, age = t - ts;
    if (age < 0 || age > .4 || ts < shotStart) continue;
    const b = sidePos(ts), k = age / .4;
    const x = b.x - (scroll - scrollAt(ts)) * .9 - 40 + Math.cos(i) * b.r * .7;
    const y = b.y + (rand(i + 3100) - .5) * b.r * 1.8 + (rand(i + 3200) - .5) * 160 * k;
    ctx.fillStyle = i % 2 ? YELLOW : WHITE;
    const len = 30 + speedAt(t) * 200, w = (4 + rand(i + 3300) * 5) * (1 - k);
    ctx.beginPath(); ctx.moveTo(x, y - w / 2); ctx.lineTo(x + len, y); ctx.lineTo(x, y + w / 2); ctx.closePath(); ctx.fill();
  }
}
function sonicBoom(t, tb, b, scroll) {
  const k = prog(t, tb, tb + .45);
  if (k <= 0 || k >= 1) return;
  const back = (scroll - scrollAt(tb)) * .55;
  for (const [d, m, lw, col] of [[0, 1, 16, WHITE], [.05, .7, 8, YELLOW], [.1, .5, 5, WHITE]]) {
    const kk = prog(t, tb + d, tb + .45);
    if (kk <= 0 || kk >= 1) continue;
    const ry = b.r * (1.1 + 3.3 * m * easeOutExpo(kk)), rx = ry * .28;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw * (1 - kk) + 2;
    ctx.beginPath(); ctx.ellipse(b.x + b.r * .4 - back * (1 + d * 4), b.y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
}
function sideShot(t) {
  const sp = speedAt(t), scroll = scrollAt(t), shotStart = t < T.side1[1] ? T.side1[0] : T.side2[0];
  const hot = t >= T.side2[0];
  // boom frames: 2 flat burst frames
  for (const tb of [T.boom1, T.boom2]) {
    const d = t - tb;
    if (d >= 0 && d < .085) {
      const b = sidePos(t), white = d < .042;
      sunburst(b.x, b.y, white ? WHITE : INK, white ? YELLOW : '#3a1230', 28, d * 4);
      applyCam(C.x, C.y, 1.05, 0, ...shakeXY(t, 30));
      aura(b.x, b.y, b.r, Math.PI, .9, 2.4, t, 1);
      drawBall(b.x, b.y, b.r, t, { stretch: 1.5, silhouette: white ? INK : null });
      letterbox(1);
      return;
    }
  }
  const sh = 4 + sp * 20 + (t > T.boom1 && t < T.boom1 + .35 ? 30 * (1 - prog(t, T.boom1, T.boom1 + .35)) : 0) + (t > T.boom2 && t < T.boom2 + .35 ? 36 * (1 - prog(t, T.boom2, T.boom2 + .35)) : 0);
  const zoom = !hot ? lerp(1.25, 1.0, easeOutCubic(prog(t, ...T.side1))) : lerp(1.1, .95, prog(t, ...T.side2));
  const rot = !hot ? lerp(-.04, -.1, prog(t, ...T.side1)) : lerp(.09, .04, prog(t, ...T.side2));
  applyCam(C.x, C.y, zoom, rot, ...shakeXY(t, sh));
  sideBackground(t, sp, scroll, hot);
  const b = sidePos(t);
  streamTrail(b.x - b.r * .2, b.y, b.r, 320 + sp * 2300, t);
  sideSparks(t, shotStart, scroll);
  aura(b.x, b.y, b.r, Math.PI, .6 + sp * .35, .55 + sp * 1.7, t, 1);
  drawBall(b.x, b.y, b.r, t, { stretch: 1 + sp * .35 });
  // compressed-air front arcs
  ctx.save(); ctx.strokeStyle = WHITE; ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    ctx.lineWidth = 6 - i * 2 + sp * 4;
    ctx.beginPath(); ctx.ellipse(b.x + b.r * (.2 + i * .25), b.y, b.r * (1.1 + i * .22 + sp * .2), b.r * (1.06 + i * .15), 0, -Math.PI / 2.6, Math.PI / 2.6); ctx.stroke();
  }
  ctx.restore();
  sonicBoom(t, T.boom1, b, scroll);
  sonicBoom(t, T.boom2, b, scroll);
  foregroundDebris(t, sp, scroll);
  speedLines(t, sp * 1.2, -1, 4400, 26);
  screenFill(WHITE, 1 - prog(t, shotStart, shotStart + .085));
  letterbox(1);
}

// =====================================================================
// INSERT CLOSE-UPS — extreme close-up of the spinning ball
// =====================================================================
function insertShot(t, a, b, seed) {
  const k = prog(t, a, b);
  sunburst(W * .62, H * .5, AMBER, '#ffb52e', 30, k * .9 + seed);
  applyCam(C.x, C.y, 1, seed % 2 ? .12 : -.12, ...shakeXY(t, 14));
  focusLines(W * .62, H * .5, 1, 7000 + seed * 50, '20,12,16', 520);
  const r = lerp(560, 640, k);
  const x = W * .62 + (seed % 2 ? -1 : 1) * lerp(80, -40, k), y = H * .5;
  aura(x, y, r, Math.PI, .3, .32, t, 1);
  drawBall(x, y, r, t, {});
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = WHITE;
  for (let i = 0; i < 3; i++) { const yy = H * (.2 + .3 * i) + Math.sin(i + seed) * 40; const xx = lerp(-W, W * 2, prog(k, i * .1, .6 + i * .1)); ctx.fillRect(xx - 900, yy, 900, 6 + i * 3); }
  ctx.restore();
  letterbox(1);
}

// =====================================================================
// FRONT SHOT — head-on, then passes glued to the lens
// =====================================================================
function posFront(t) {
  const k = prog(t, T.front[0], T.front[1] - .12), k2 = prog(t, T.front[1] - .14, T.front[1]);
  return { x: C.x + Math.sin(t * 3.1) * 25 + easeInQuad(k2) * 650, y: C.y + Math.cos(t * 2.7) * 18 + easeInQuad(k2) * 260, r: lerp(95, 260, easeInQuad(k)) + easeInCubic(k2) * 3200 };
}
function frontShot(t) {
  const k = prog(t, ...T.front), b = posFront(t);
  sunburst(b.x, b.y, '#1a1030', '#26173f', 22, t * 1.5);
  applyCam(C.x, C.y, lerp(1, 1.12, k), lerp(.07, -.06, k), ...shakeXY(t, 10 + 22 * k));
  for (let i = 0; i < 160; i++) {
    const a = rand(i + 5000) * Math.PI * 2, r0 = 40 + rand(i + 5100) * 380;
    const z = 1 - ((rand(i + 5200) + (t - T.front[0]) * 1.8) % 1), z2 = Math.min(1, z + .1);
    const p1 = r0 / Math.max(z, .02), p2 = r0 / z2, w = 2 + (1 - z) * 7;
    ctx.fillStyle = i % 4 ? 'rgba(235,235,255,.85)' : YELLOW;
    ctx.beginPath();
    ctx.moveTo(b.x + Math.cos(a) * p2, b.y + Math.sin(a) * p2);
    ctx.lineTo(b.x + Math.cos(a) * p1 - Math.sin(a) * w, b.y + Math.sin(a) * p1 + Math.cos(a) * w);
    ctx.lineTo(b.x + Math.cos(a) * p1 + Math.sin(a) * w, b.y + Math.sin(a) * p1 - Math.cos(a) * w);
    ctx.closePath(); ctx.fill();
  }
  aura(b.x, b.y, b.r, 0, 0, .7, t, 1);
  drawBall(b.x, b.y, b.r, t, {});
  screenFill(WHITE, 1 - prog(t, T.front[0], T.front[0] + .085));
  screenFill(AMBER, prog(t, T.front[1] - .07, T.front[1] - .035));
  screenFill(WHITE, prog(t, T.front[1] - .035, T.front[1] - .01));
  letterbox(1);
}

// =====================================================================
// FINAL — slam into the logo spot, pull-out title reveal
// =====================================================================
const CAM4 = () => [
  [T.side2[1], L.ball.x + 160, L.ball.y + 15, 1.8, -.16, null],
  [T.hit, L.ball.x, L.ball.y, 1.55, -.08, easeOutCubic],
  [HOLD, L.ball.x, L.ball.y, 1.55, -.08, linear],
  [HOLD + .5, C.x, C.y, 1, 0, easeOutExpo],
];
function posArrive(t) {
  if (t < T.arrive[0]) return null;
  const k = easeOutQuart(prog(t, ...T.arrive)), F = L.ball;
  return { x: lerp(-560, F.x, k), y: lerp(F.y + 120, F.y, k), r: lerp(FINAL_R * 1.4, FINAL_R, k) };
}
function drawImpact(t) {
  const dt = t - T.hit; if (dt < 0) return;
  const { x, y } = L.ball, R = FINAL_R;
  const rk = prog(dt, .08, .6);
  if (rk < 1) {
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2 + rand(i) * .25, len = R * (2.5 + rand(i + 20) * 4.5) * easeOutExpo(rk), w = (8 + rand(i + 40) * 16) * (1 - rk);
      ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = i % 2 ? WHITE : YELLOW;
      ctx.beginPath(); ctx.moveTo(R * .9, -w); ctx.lineTo(R + len, 0); ctx.lineTo(R * .9, w); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  for (const [d, m, lw, col] of [[.08, 4.6, 22, WHITE], [.12, 3.1, 10, YELLOW], [.2, 2, 6, WHITE]]) {
    const k = prog(dt - d, 0, .45);
    if (k > 0 && k < 1) ring(x, y, R * lerp(1, m, easeOutExpo(k)), lw * (1 - k) + 2, 1 - k * .6, col);
  }
  const sk = prog(dt, .08, .9);
  if (sk < 1) {
    for (let i = 0; i < 36; i++) {
      const a = rand(i + 100) * Math.PI * 2, sp = R * (2.2 + rand(i + 200) * 4.8);
      const d1 = R + sp * easeOutExpo(sk), d0 = R + sp * easeOutExpo(Math.max(0, sk - .08)), g2 = sk * sk * 60;
      ctx.strokeStyle = i % 3 ? YELLOW : WHITE; ctx.lineWidth = (4 + rand(i + 300) * 5) * (1 - sk);
      ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * d0, y + Math.sin(a) * d0 + g2); ctx.lineTo(x + Math.cos(a) * d1, y + Math.sin(a) * d1 + g2); ctx.stroke();
    }
  }
  focusLines(x, y, 1 - prog(dt, .085, .45), 3000, '255,250,235', 230);
}
function glow(x, y, r, s, rad = 2.1) {
  if (s <= 0) return;
  const g = ctx.createRadialGradient(x, y, r * .7, x, y, r * rad);
  g.addColorStop(0, `rgba(255,200,70,${.6 * s})`); g.addColorStop(.45, `rgba(255,160,40,${.2 * s})`); g.addColorStop(1, 'rgba(255,140,30,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * rad, 0, Math.PI * 2); ctx.fill();
}
function drawTitle(t) {
  const t0 = T.hit + .03;
  if (t < t0) return;
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H);
  tctx.font = FONT_TITLE; tctx.textBaseline = 'alphabetic'; tctx.lineJoin = 'round';
  L.letters.forEach((l, i) => {
    const k = prog(t, t0 + i * .03, t0 + i * .03 + .17);
    if (k <= 0) return;
    const e = easeOutBack(k, 3), s = lerp(2.6, 1, e);
    const hot = 1 - prog(t, t0 + i * .03 + .08, t0 + i * .03 + .3);
    tctx.save();
    tctx.translate(l.x + l.w / 2, L.titleY - 48 + lerp(-80, 0, e)); tctx.scale(s, s); tctx.rotate(lerp(-.35, 0, e));
    if (hot > 0) { tctx.strokeStyle = `rgba(20,12,16,${hot})`; tctx.lineWidth = 10; tctx.strokeText(l.ch, -l.w / 2, 48); }
    tctx.fillStyle = hot > .5 ? WHITE : '#ffd44d';
    tctx.fillText(l.ch, -l.w / 2, 48);
    tctx.restore();
  });
  for (const gs of [T.hit + .95, T.hit + 2.1]) {
    const gk = prog(t, gs, gs + .4);
    if (gk <= 0 || gk >= 1) continue;
    tctx.save(); tctx.globalCompositeOperation = 'source-atop'; tctx.fillStyle = 'rgba(255,255,245,.95)';
    const cx = lerp(L.textX - 200, L.textX + L.titleW + 200, easeInOut(gk));
    tctx.setTransform(1, 0, -.35, 1, 0, 0);
    tctx.fillRect(cx - 40 + L.titleY * .35, 0, 50, H); tctx.fillRect(cx + 30 + L.titleY * .35, 0, 14, H);
    tctx.restore();
  }
  ctx.drawImage(textCv, 0, 0);
  const k2 = prog(t, T.hit + .45, T.hit + .75);
  if (k2 > 0) {
    ctx.save(); ctx.font = FONT_SUB; ctx.fillStyle = '#c5c8de';
    const full = 'Escolha o jogo', n = Math.ceil(full.length * k2);
    ctx.fillText(full.slice(0, n), L.textX + 4, L.subY);
    ctx.restore();
  }
  for (const ts of [T.hit + 1.2, T.hit + 2.4]) {
    const tw = prog(t, ts, ts + .25);
    twinkle(L.ball.x - FINAL_R * .45, L.ball.y - FINAL_R * .6, 60 * bell(tw), 1);
  }
}
let K4 = null;
function finalShot(t) {
  if (!K4) K4 = CAM4();
  const dt = t - T.hit;
  if (dt >= 0 && dt < .085) {                         // impact frames
    const white = dt < .042;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = white ? WHITE : '#000'; ctx.fillRect(0, 0, W, H);
    const [cx, cy, z, r] = interpKeys(K4, t); applyCam(cx, cy, z, r, ...shakeXY(t, 20));
    focusLines(L.ball.x, L.ball.y, 1, 5000 + (white ? 0 : 77), white ? '20,12,16' : '255,250,235', 120, 120);
    ctx.save(); ctx.translate(L.ball.x, L.ball.y); celBall(FINAL_R * 1.1, 0, 0, { silhouette: white ? INK : WHITE }); ctx.restore();
    return;
  }
  let [cx, cy, z, rot] = interpKeys(K4, t);
  const pd = t - HOLD; if (pd >= 0) z *= 1 + .12 * Math.exp(-pd * 14);
  const sh = t >= T.hit ? 30 * Math.exp(-(t - T.hit) * 7) : 10;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < T.hit) { sunburst(L.ball.x, L.ball.y, '#10142a', '#161c38', 26, t); speedLines(t, 1.1, 1, 2700); }
  else dotsBackdrop(t, cx, cy, z, rot);
  applyCam(cx, cy, z, rot, ...shakeXY(t, sh));
  const b = posArrive(t);
  if (b && t < T.hit) { ribbonFn(posArrive, t, .12, 1); ghostsFn(posArrive, t, 3, .02); }
  if (b) {
    if (t >= T.hit) glow(b.x, b.y, b.r, prog(t, HOLD, HOLD + .6) * (1 + .1 * Math.sin(dt * 5)));
    if (t < T.hit) aura(b.x, b.y, b.r, Math.PI, .75, 1.7, t, 1);
    else aura(b.x, b.y, b.r, 0, 0, .3, t, 1 - prog(t, HOLD, HOLD + .7));
    if (t < T.hit) drawBallFn(posArrive, t, b);
    else drawBall(b.x, b.y, b.r, t, { squash: spring(dt - .085, 34, 9) * .18 });
  }
  drawImpact(t);
  drawTitle(t);
  screenFill(WHITE, 1 - prog(t, T.side2[1], T.side2[1] + .085));
  letterbox(1 - easeOutExpo(prog(t, HOLD, HOLD + .5)));
}

// ---------- dispatcher ----------
function scene(t) {
  ctx = sctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < T.launch[1]) shot1(t);
  else if (t >= T.insert1[0] && t < T.insert1[1]) insertShot(t, ...T.insert1, 1);
  else if (t >= T.insert2[0] && t < T.insert2[1]) insertShot(t, ...T.insert2, 2);
  else if (t < T.front[0]) sideShot(t);
  else if (t < T.front[1]) frontShot(t);
  else if (t < T.side2[1]) sideShot(t);
  else finalShot(t);
}
function draw(t) { if (!L) layout(); scene(t); octx.drawImage(sceneCv, 0, 0); }

window.draw = draw;
window.DURATION = DURATION;

if (!new URLSearchParams(location.search).has('render')) {
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); out.style.width = W * s + 'px'; out.style.height = H * s + 'px'; };
  addEventListener('resize', fit); fit();
  let start = performance.now(), last = -1;
  const loop = now => {
    let t = (now - start) / 1000; if (t > DURATION + 1) { start = now; t = 0; }
    const f = Math.floor(Math.min(t, DURATION) * 24); if (f !== last) { last = f; draw(f / 24); }
    requestAnimationFrame(loop);
  };
  document.fonts.load(FONT_TITLE).then(() => requestAnimationFrame(loop));
}
</script>
