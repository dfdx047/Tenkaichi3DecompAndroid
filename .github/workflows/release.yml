# Builds the Linux and Windows release archives on GitHub's machines, from the repository alone.
# No disc and no game data are involved: the game's data tables are built blank (port/data) and the finished
# program fetches their values from the user's own disc at start. The same build runs locally with
# port/release/build.sh.
#
#   a tag  v*                 the same, and a draft release with both archives attached
#   "Run workflow" button     the archives as downloadable artifacts of the run
name: release

# (This repository is the Android port: the PC archives are built on a tag v* or by hand only, not on every push.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the draft release on a tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The build container (port/release/Dockerfile): Ubuntu 22.04, clang/LLVM 22, SDL3 from source, mingw-w64.
      # Its layers are cached between runs, so only the first run pays for building it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: port/release
          tags: bt3-port-release:jammy
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build both archives
        run: |
          mkdir -p port/build
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/src -w /src \
            bt3-port-release:jammy sh port/release/inside.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi3Decomp-linux-x64
          path: port/build/Tenkaichi3Decomp-linux-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi3Decomp-windows-x64
          path: port/build/Tenkaichi3Decomp-windows-x64.zip
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --generate-notes \
            port/build/Tenkaichi3Decomp-linux-x64.zip port/build/Tenkaichi3Decomp-windows-x64.zip
