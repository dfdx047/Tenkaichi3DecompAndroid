# Builds the Dragon Rage Android app (android/).
#
#   push / pull request                      the release APK as an artifact of the run (a build check)
#   push to main                             the same, and the "android-nightly" pre-release (its APK replaced)
#   a tag  android-vX.Y.Z                    the same, and the release "Dragon Rage X.Y.Z" with its APK
#   "Run workflow" button                    the same as a push
#
# Versions: the tag gives the version name (android-v0.2.0 -> 0.2.0), the run number the version code; other
# builds are 0.0.0-dev.<run>.
#
# Release signing: set the repository secrets DR_KEYSTORE_BASE64 (the .jks file, base64), DR_KEYSTORE_PASSWORD,
# DR_KEY_ALIAS and DR_KEY_PASSWORD. Without them the APK is signed with a throwaway debug key, and each build
# then has a different signature (uninstall before installing a newer one).
name: android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths: ["android/**", "port/**", "src/**", "include/**", "bt2/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "port/**", "src/**", "include/**", "bt2/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Budokai Tenkaichi 2's runtime (bt2/) for Android arm64 without the game's code, which is never here: does
  # the handwritten part and paraLLEl-GS compile with the NDK, and do the retained EE stacks (their own stack
  # switch on AArch64) pass BT2's tests on an emulated arm64? Not blocking: BT3's APK is built and released
  # whatever this says.
  bt2-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: SDL3 for Android arm64 (the engine toolchain's)
        run: |
          mkdir -p port/build/android-toolchain && cd port/build/android-toolchain
          curl -fsSL "https://github.com/dfdx047/Tenkaichi3DecompAndroid/releases/download/toolchain-ndk/sdl3-android-arm64.tar.xz" | xz -dc | tar -x

      - name: BT2 runtime for Android arm64
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" python3 bt2/android/build.py check > bt2_check.txt 2>&1 || { tail -60 bt2_check.txt > bt2_check_errors.txt; sh .github/annotate.sh bt2_check_errors.txt; exit 1; }
          tail -3 bt2_check.txt

      - name: Retained EE stacks on arm64 (QEMU) and x86-64
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user > /dev/null
          for target in aarch64-linux-gnu-g++ g++; do
            $target -std=c++20 -O2 -static -Ibt2/runtime -Ibt2/runtime/ee bt2/runtime/tests/retained_ee_stack_tests.cpp bt2/runtime/ee/retained_ee_stack.cpp -o stack-tests-$target
          done
          qemu-aarch64 ./stack-tests-aarch64-linux-gnu-g++
          ./stack-tests-g++

  build:
    runs-on: ubuntu-24.04 # has the Android SDK; ANDROID_HOME is set
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The engine (port/tools/android.py): upstream LLVM 21 + the runner's NDK + SDL3
      - uses: actions/cache@v4
        with:
          path: port/build/android-toolchain/llvm
          key: llvm-21.1.0-linux-x64-v2
      - name: Engine toolchain
        working-directory: .
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh port/tools/android_toolchain.sh > toolchain.txt 2>&1 || { sh .github/annotate.sh toolchain.txt; exit 1; }
          tail -3 toolchain.txt
      - name: Engine
        working-directory: .
        env:
          BT3_SKELETON: "1"
        run: |
          python3 port/tools/android.py > engine_build.txt 2>&1 || true
          tail -5 engine_build.txt
          grep -q "^installed into" engine_build.txt || { grep -E "^FAILED|error|stubs|link|loader" engine_build.txt > engine_errors.txt || true; tail -30 engine_build.txt >> engine_errors.txt; sh .github/annotate.sh engine_errors.txt; exit 1; }
          sh .github/annotate.sh engine_build.txt notice
          ls -la android/app/src/main/jniLibs/arm64-v8a

      # Budokai Tenkaichi 2 (bt2/, libbt2.so): only where its code was generated from a disc image. That code never
      # goes into this public repository (bt2/docs/project/LEGAL.md); a private copy that holds bt2/game/generated
      # builds the APK with both games (libbt2.so makes its startup inputs from the player's disc). Without it
      # this step is skipped: the players import BT2's engine as a signed motor package shared outside GitHub
      # (bt2/android/build.py package; the app's BT2 tab, data/Bt2Engine.kt).
      - name: Engine BT2 (when its generated code is present)
        if: hashFiles('bt2/game/generated/bt2/FUN_0032EEE0_0x32eee0.cpp') != ''
        working-directory: .
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" python3 bt2/android/build.py > bt2_build.txt 2>&1 || { tail -60 bt2_build.txt > bt2_errors.txt; sh .github/annotate.sh bt2_errors.txt; exit 1; }
          tail -3 bt2_build.txt
          ls -la android/app/src/main/jniLibs/arm64-v8a

      # Dragon Rage's own part of BT2 (bt2/plugin: libbt2online.so, the Online Mode menu and its screens, the music, later the online
      # play): it needs nothing of the game's code, so it is built here for every APK. The BT2 engine (the players import it) loads
      # it from the app's native libraries. Not blocking: without it the APK is as it was and BT2's main menu stays the game's.
      - name: BT2 plugin (libbt2online.so)
        continue-on-error: true
        working-directory: .
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" python3 bt2/android/build.py plugin > bt2_plugin.txt 2>&1 || { tail -40 bt2_plugin.txt > bt2_plugin_errors.txt; sh .github/annotate.sh bt2_plugin_errors.txt; exit 1; }
          tail -2 bt2_plugin.txt
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            echo "DR_VERSION_NAME=${GITHUB_REF#refs/tags/android-v}" >> "$GITHUB_ENV"
          else
            echo "DR_VERSION_NAME=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "DR_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DR_KEYSTORE_BASE64 }}
          DR_KEYSTORE_PASSWORD: ${{ secrets.DR_KEYSTORE_PASSWORD }}
          DR_KEY_ALIAS: ${{ secrets.DR_KEY_ALIAS }}
          DR_KEY_PASSWORD: ${{ secrets.DR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "DR_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "DR_KEYSTORE_PASSWORD=$DR_KEYSTORE_PASSWORD"
              echo "DR_KEY_ALIAS=$DR_KEY_ALIAS"
              echo "DR_KEY_PASSWORD=$DR_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: the release APK is signed with a debug key."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease > ../gradle.txt 2>&1 || { grep -E "^e: |error:|FAILURE|What went wrong" -A3 ../gradle.txt > ../gradle_errors.txt || true; tail -20 ../gradle.txt >> ../gradle_errors.txt; sh ../.github/annotate.sh ../gradle_errors.txt; exit 1; }

      - name: Collect APKs
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/DragonRage-${DR_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DragonRage-${{ env.DR_VERSION_NAME }}
          path: out/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dragon Rage ${{ env.DR_VERSION_NAME }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: out/*.apk
          body: |
            Dragon Rage ${{ env.DR_VERSION_NAME }} for Android (arm64, Android 10 or newer).
            Install `DragonRage-${{ env.DR_VERSION_NAME }}.apk`; it updates an earlier version and keeps your game data.
            You need your own disc image of the USA release (SLUS-21678). See the README for what works and what is next.

      # Every push to main: the latest build as the "nightly" pre-release (one tag, its APKs replaced each time)
      - name: Nightly
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: .
        run: |
          cp "out/DragonRage-${DR_VERSION_NAME}.apk" out/DragonRage-nightly.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          tag_name: android-nightly
          name: Dragon Rage nightly
          prerelease: true
          overwrite_files: true
          files: out/DragonRage-nightly.apk
          body: |
            The latest build of main (${{ github.sha }}, version 0.0.0-dev.${{ github.run_number }}). For testing: things
            may be broken. For a stable version, take the latest release. Logs: Settings > Save log to Downloads, or
            `adb logcat -s bt3`.
