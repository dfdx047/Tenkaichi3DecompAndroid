name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-layout:
    name: Portable layout (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test portable layout checker without game data
        run: python -m unittest discover -s tools/review/tests -v
      - name: Test DDS formats and large texture archive offsets
        if: runner.os == 'Linux'
        run: python port/tests/texture_pack/run.py
      - name: Test ADX version 3 and 4 music loops
        if: runner.os == 'Linux'
        run: python port/tests/audio_loop/run.py
      - name: Test health tiers and native palette cache identities
        if: runner.os == 'Linux'
        run: python port/tests/palette/run.py
      - name: Test authenticated Tag Team negotiation and recovery
        run: node --test cloudflare/tests/tag_link.test.mjs cloudflare/tests/voice_hibernation.test.mjs
